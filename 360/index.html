<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unsaid · Anonymous 360 feedback</title>
<meta name="description" content="Hear what your team won't say to your face. Anonymous feedback rounds with an AI synthesis: no quotes, no names, just the patterns.">
<meta name="theme-color" content="#f2f3e8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,50..100&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f3e8; --bg-2: #fcfcf5; --card: #fcfdfa; --ink: #101828; --ink-2: #1e1e1e;
  --muted: #78796c; --line: #e4e4dc; --line-2: #c6c7bb; --soft: #e9eadf;
  --orange: #ff5a39; --orange-2: #e34a2b; --orange-ink: #c63d21;
  --purple: #e8b9ff; --blue: #6eccff; --green: #aee52f; --pink: #ec73a4; --yellow: #ecd541; --teal: #44c4a2; --indigo: #6981ff;
  --on-pastel: #101828;
  --night: #101828; --night-2: #1b2333; --night-ink: #f2f3e8; --night-muted: #a1a297;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 40px -12px rgba(16,24,40,.14);
  --r: 24px;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d111a; --bg-2: #121722; --card: #171d2a; --ink: #f2f3e8; --ink-2: #e4e4dc;
    --muted: #a1a297; --line: #262d3b; --line-2: #3a4253; --soft: #1e2534;
    --orange-ink: #ff7a5f;
    --night: #171d2a; --night-2: #202838;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: inherit; }
img, svg { display: block; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }
.narrow { max-width: 760px; margin: 0 auto; padding: 0 20px; }
.serif { font-family: var(--serif); font-weight: 300; font-variation-settings: 'SOFT' 100; letter-spacing: -.02em; }
.muted { color: var(--muted); }
.hide { display: none !important; }

/* Highlights, borrowed from the brand's marker-pill headline style */
.hl { padding: 0 .14em; border-radius: .22em; color: var(--on-pastel); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hl-purple { background: var(--purple); } .hl-blue { background: var(--blue); } .hl-green { background: var(--green); } .hl-yellow { background: var(--yellow); } .hl-pink { background: var(--pink); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 14px 24px; font-weight: 500; font-size: 15px; text-decoration: none; white-space: nowrap; transition: background .15s, transform .15s, border-color .15s; border: 1px solid transparent; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--orange); color: #fff; }
.btn.primary:hover { background: var(--orange-2); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.ghost { border-color: var(--line-2); background: transparent; }
.btn.ghost:hover { border-color: var(--ink); }
.btn.sm { padding: 9px 16px; font-size: 14px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.link:hover { text-decoration-color: currentColor; }

/* Nav */
.nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.nav.scrolled { border-bottom-color: var(--line); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
.logo { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; font-family: var(--serif); font-size: 26px; font-weight: 400; letter-spacing: -.03em; font-variation-settings: 'SOFT' 100; }
.logo svg { width: 30px; height: 30px; }
.nav-links { display: flex; align-items: center; gap: 28px; font-size: 14.5px; }
.nav-links button, .nav-links a { color: var(--ink); text-decoration: none; opacity: .8; }
.nav-links button:hover, .nav-links a:hover { opacity: 1; }
.nav-right { display: flex; align-items: center; gap: 10px; }
@media (max-width: 820px) { .nav-links { display: none; } }

.preview-bar { background: var(--ink); color: var(--bg); font-size: 13px; text-align: center; padding: 8px 16px; }
.preview-bar button { text-decoration: underline; text-underline-offset: 2px; color: inherit; }

/* Hero */
.hero { padding: 64px 0 40px; }
.hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; padding: 6px 14px 6px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); margin-left: 4px; }
.hero h1 { font-size: clamp(44px, 6.4vw, 82px); line-height: 1.02; margin: 22px 0 22px; }
.hero p.lede { font-size: 18px; max-width: 34em; color: var(--ink); opacity: .78; }
.hero .ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
.hero .fine { margin-top: 16px; font-size: 13px; color: var(--muted); }
@media (max-width: 920px) { .hero .wrap { grid-template-columns: 1fr; gap: 48px; } .hero { padding-top: 40px; } }

/* Hero visual */
.stage { position: relative; min-height: 470px; }
.blk { position: absolute; border-radius: 30px; }
.blk.a { background: var(--purple); width: 46%; height: 52%; right: 0; top: 0; transform: rotate(6deg); }
.blk.b { background: var(--blue); width: 38%; height: 40%; left: 2%; bottom: 2%; transform: rotate(-7deg); }
.blk.c { background: var(--green); width: 24%; height: 24%; right: 6%; bottom: 6%; transform: rotate(12deg); border-radius: 22px; }
.mock { position: relative; z-index: 2; margin: 40px 7% 0; background: var(--card); border-radius: 26px; box-shadow: var(--shadow); padding: 22px; border: 1px solid var(--line); }
.mock-top { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--muted); }
.mock h4 { font-family: var(--serif); font-weight: 400; font-size: 21px; line-height: 1.28; margin: 14px 0 16px; letter-spacing: -.01em; }
.mock-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.mock-row b { font-weight: 500; display: block; }
.mock-row span.t { color: var(--muted); font-size: 13px; }
.badge-float { position: absolute; z-index: 3; left: -2%; top: 8px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 500; padding: 10px 14px; border-radius: 14px; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow); transform: rotate(-3deg); }
.badge-float.two { left: auto; right: -1%; top: auto; bottom: 22px; background: var(--card); color: var(--ink); border: 1px solid var(--line); transform: rotate(3deg); }
@media (max-width: 520px) { .stage { min-height: 420px; } .mock { margin: 34px 0 0; } .badge-float { left: 4px; top: 0; } .badge-float.two { right: 4px; bottom: 8px; } }

/* Consensus chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; white-space: nowrap; color: var(--on-pastel); }
.chip.most { background: var(--green); } .chip.several { background: var(--blue); } .chip.one { background: var(--purple); }
.chip.plain { background: var(--soft); color: var(--ink); }

/* Sections */
section.sec { padding: 96px 0; scroll-margin-top: 60px; }
#form { scroll-margin-top: 84px; }
.sec-head { max-width: 760px; margin-bottom: 48px; }
.sec-head .kicker { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--orange-ink); }
.sec-head h2 { font-size: clamp(34px, 4.4vw, 54px); line-height: 1.06; margin-top: 14px; }
.sec-head p { margin-top: 16px; font-size: 17px; opacity: .78; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 920px) { .grid3, .grid4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .grid3, .grid4 { grid-template-columns: 1fr; } section.sec { padding: 72px 0; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; }
.card h3 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.2; letter-spacing: -.01em; margin-bottom: 10px; }
.card p { font-size: 15px; opacity: .78; }
.tile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 22px; color: var(--on-pastel); }
.tile svg { width: 22px; height: 22px; }

.steps { counter-reset: s; }
.step { position: relative; padding-top: 74px; }
.step::before { counter-increment: s; content: counter(s); position: absolute; top: 0; left: 0; font-family: var(--serif); font-weight: 300; font-size: 64px; line-height: 1; color: var(--orange); }

.night { background: var(--night); color: var(--night-ink); border-radius: 40px; margin: 0 12px; }
.night .sec-head p, .night .card p { color: var(--night-muted); opacity: 1; }
.night .card { background: var(--night-2); border-color: transparent; }
@media (max-width: 600px) { .night { margin: 0 8px; border-radius: 28px; } }

.compare { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 15px; }
.compare th, .compare td { text-align: left; padding: 18px 22px; border-bottom: 1px solid var(--line); vertical-align: top; }
.compare tr:last-child td { border-bottom: 0; }
.compare thead th { font-weight: 500; font-size: 13px; color: var(--muted); background: var(--bg-2); }
.compare td:first-child { font-weight: 500; width: 24%; }
.compare td.us { background: color-mix(in srgb, var(--green) 18%, transparent); }
@media (max-width: 600px) { .compare th, .compare td { padding: 14px 12px; font-size: 14px; } .compare td:first-child { width: 28%; } }

.price { display: flex; flex-direction: column; }
.price .amt { font-family: var(--serif); font-size: 46px; font-weight: 300; letter-spacing: -.03em; margin: 8px 0 2px; }
.price .amt small { font-family: var(--sans); font-size: 14px; color: var(--muted); letter-spacing: 0; }
.price ul { list-style: none; margin: 20px 0 26px; font-size: 14.5px; flex: 1; }
.price li { padding: 7px 0 7px 26px; position: relative; }
.price li::before { content: ''; position: absolute; left: 2px; top: 13px; width: 12px; height: 7px; border-left: 2px solid var(--teal); border-bottom: 2px solid var(--teal); transform: rotate(-45deg); }
.price.feature { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.price.feature p, .price.feature .amt small { color: var(--bg); opacity: .7; }
.price-note { margin-top: 18px; font-size: 13px; color: var(--muted); }

.faq details { border-top: 1px solid var(--line); padding: 22px 0; }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; font-size: 18px; font-weight: 500; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; font-weight: 300; font-size: 26px; line-height: 1; transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { margin-top: 12px; opacity: .78; max-width: 46em; }

.band { background: var(--orange); color: #fff; border-radius: 40px; padding: 72px 32px; text-align: center; margin: 0 12px; }
.band h2 { font-size: clamp(34px, 5vw, 60px); line-height: 1.05; max-width: 15em; margin: 0 auto 28px; }
.band .btn.dark { background: #101828; color: #f2f3e8; }
@media (max-width: 600px) { .band { margin: 0 8px; border-radius: 28px; padding: 56px 22px; } }
footer.foot { padding: 48px 0 56px; font-size: 13px; color: var(--muted); }
footer.foot .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* App pages */
.page { padding: 40px 0 96px; }
.page-head h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.06; margin: 10px 0 10px; }
.page-head p { opacity: .78; font-size: 17px; }
.back { font-size: 14px; color: var(--muted); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--ink); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; margin-top: 20px; }
.panel h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; letter-spacing: -.01em; line-height: 1.2; }
.panel h2 + p { margin-top: 6px; color: var(--muted); font-size: 14.5px; }
@media (max-width: 600px) { .panel { padding: 22px 18px; } }

.tpls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 28px; }
@media (max-width: 820px) { .tpls { grid-template-columns: 1fr 1fr; } }
@media (max-width: 460px) { .tpls { grid-template-columns: 1fr; } }
.tpl { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 20px; transition: border-color .15s, transform .15s; }
.tpl:hover { border-color: var(--line-2); transform: translateY(-1px); }
.tpl.on { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent); }
.tpl .tile { margin-bottom: 16px; width: 40px; height: 40px; border-radius: 12px; }
.tpl b { display: block; font-weight: 500; margin-bottom: 4px; }
.tpl span { font-size: 13.5px; color: var(--muted); line-height: 1.45; display: block; }

.field { margin-top: 22px; }
.field > label, .label { display: block; font-weight: 500; font-size: 14.5px; margin-bottom: 8px; }
.field .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
.input, .textarea { width: 100%; background: var(--bg-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 15px; font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus, .textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 8%, transparent); }
.textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 600px) { .row2 { grid-template-columns: 1fr; } }

.qlist { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.q { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; background: var(--bg-2); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px; }
.q textarea { border: 0; background: transparent; resize: none; outline: none; font-size: 15.5px; padding: 6px 4px; min-height: 0; line-height: 1.45; width: 100%; overflow: hidden; }
.q:focus-within { border-color: var(--ink); }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }
.seg button { font-size: 12.5px; font-weight: 500; padding: 5px 11px; border-radius: 999px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--soft); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
@media (max-width: 520px) { .q { grid-template-columns: 1fr auto; } .q .seg { grid-column: 1 / -1; justify-self: start; } }
.addq { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--bg-2); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; }
.stepper button:hover { background: var(--soft); }
.stepper output { min-width: 34px; text-align: center; font-weight: 600; font-size: 17px; }
.warn { margin-top: 10px; font-size: 13.5px; background: color-mix(in srgb, var(--yellow) 30%, transparent); padding: 10px 14px; border-radius: 12px; }
.err { margin-top: 16px; font-size: 14px; color: var(--orange-ink); font-weight: 500; }
.form-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 28px; flex-wrap: wrap; }

/* Dashboard */
.dash-grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; margin-top: 28px; }
.dash-grid > * { margin-top: 0; }
@media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
.progress { display: flex; gap: 20px; align-items: center; }
.ring { width: 96px; height: 96px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: flex; align-items: baseline; justify-content: center; padding-top: 26px; font-family: var(--serif); font-size: 30px; font-weight: 400; }
.ring .num small { font-size: 14px; color: var(--muted); font-family: var(--sans); }
.inv { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.inv:first-of-type { border-top: 0; }
.inv .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inv .acts { display: flex; gap: 4px; flex: none; }
.tag { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.sample-bar { background: color-mix(in srgb, var(--purple) 45%, var(--card)); color: var(--on-pastel); border-radius: 18px; padding: 16px 18px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 24px; font-size: 14.5px; }
.sample-bar .btn.dark { background: #101828; color: #f2f3e8; }

.locked { text-align: center; padding: 48px 20px; }
.locked .lock { width: 64px; height: 64px; border-radius: 20px; background: var(--soft); display: grid; place-items: center; margin: 0 auto 18px; }
.locked .lock svg { width: 28px; height: 28px; }
.locked h2 { margin-bottom: 8px; }
.locked p { color: var(--muted); max-width: 30em; margin: 0 auto; }

/* Report */
.rep-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.rep-headline { font-family: var(--serif); font-weight: 300; font-size: clamp(24px, 2.8vw, 32px); line-height: 1.25; letter-spacing: -.015em; margin: 22px 0 6px; font-variation-settings: 'SOFT' 100; }
.rep-sec { margin-top: 36px; }
.rep-sec > h3 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.rep-sec > h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.theme { padding: 16px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
.theme b { font-weight: 500; font-size: 16.5px; }
.theme p { grid-column: 1 / -1; font-size: 15px; opacity: .8; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.score { background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.score .big { font-family: var(--serif); font-size: 40px; font-weight: 300; line-height: 1; letter-spacing: -.03em; }
.score .big small { font-family: var(--sans); font-size: 14px; color: var(--muted); letter-spacing: 0; }
.score p { font-size: 13.5px; margin: 10px 0 14px; opacity: .8; min-height: 2.9em; }
.dist { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--soft); gap: 2px; }
.dist span { display: block; height: 100%; }
.dist-key { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.qsum { padding: 16px 0; border-top: 1px solid var(--line); }
.qsum b { font-weight: 500; display: block; margin-bottom: 4px; }
.qsum p { font-size: 15px; opacity: .8; }
.actions { list-style: none; counter-reset: a; }
.actions li { counter-increment: a; display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
.actions li::before { content: counter(a); width: 30px; height: 30px; border-radius: 50%; background: var(--orange); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 600; }
.rep-foot { margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

// ---------- AI (preview mode only: the live backend runs this on the server) ----------
function aiKey() { return raw.get('unsaid-openai-key') || raw.get('ben-chat-openai-key') || ''; }
async function openaiJSON(messages) {
  const key = aiKey();
  if (!key) throw Object.assign(new Error('No OpenAI key'), { code: 'nokey' });
  const body = { model: MODEL, messages, response_format: { type: 'json_object' }, max_completion_tokens: 4000, reasoning_effort: 'low' };
  const call = b => fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(b),
  });
  let r = await call(body);
  if (r.status === 400 && /reasoning_effort/.test(await r.clone().text())) { delete body.reasoning_effort; r = await call(body); }
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    try { const j = await r.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
    if (r.status === 401) msg = 'OpenAI rejected the key. Check it and try again.';
    throw new Error(msg);
  }
  const j = await r.json();
  return JSON.parse(j.choices[0].message.content);

// ---------- Backends ----------
// Both expose the same five calls. `remote` talks to the worker; `local` mimics it in localStorage.
async function http(method, path, payload) {
  let r;
  try {
    r = await fetch(API + path, { method, headers: payload ? { 'Content-Type': 'application/json' } : {}, body: payload ? JSON.stringify(payload) : undefined });
  } catch (e) { throw httpErr(0, "Couldn't reach the server. Check your connection and try again."); }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw httpErr(r.status, j.error || 'Request failed (' + r.status + ').');
  return j;

  create: spec => http('POST', '/rounds', spec),

  submit: (id, t, answers) => http('POST', '/rounds/' + enc(id) + '/invite/' + enc(t), { answers }),
  admin: (id, k) => http('GET', '/rounds/' + enc(id) + '/admin/' + enc(k)),
  report: (id, k) => http('POST', '/rounds/' + enc(id) + '/admin/' + enc(k) + '/report', {}),
};

}

  if ((await core.sha256(key)) !== r.adminHash) throw httpErr(403, 'This admin link is not valid.');

      adminHash: await core.sha256(adminKey), tokens: await Promise.all(tokens.map(core.sha256)), used: [], responses: [], report: null,

  async invite(id, token) {
    const r = need(db(), id);
    const th = await core.sha256(token);
    if (!r.tokens.includes(th)) throw httpErr(404, 'This invite link is not valid.');
    return { ...pub(r), used: r.used.includes(th) };

  async submit(id, token, answers) {
    const d = db(), r = need(d, id), th = await core.sha256(token);

    '<div class="dist-key"><span>Disagree</span><span>Agree</span></div></div>').join('');
  return '<div class="rep-head"><span class="chip plain">' + I.spark + ' Synthesis of ' + plural(r.n, 'response') + '</span><span class="no-print" style="display:flex;gap:8px">' +
    (stale ? '<button class="btn primary sm" data-act="gen">Update with ' + plural(data.count - r.n, 'new answer') + '</button>' : '<button class="btn ghost sm" data-act="gen">Regenerate</button>') +
    '<button class="btn ghost sm" data-act="print">Save PDF</button></span></div>' +
    '<p class="rep-headline">' + esc(r.headline) + '</p>' +
    (scores ? '<div class="rep-sec"><h3>Ratings</h3><div class="scores">' + scores + '</div></div>' : '') +
    (r.strengths.length ? '<div class="rep-sec"><h3><i style="background:var(--green)"></i>What people value</h3>' + themes(r.strengths) + '</div>' : '') +
    (r.growth.length ? '<div class="rep-sec"><h3><i style="background:var(--orange)"></i>Where to grow</h3>' + themes(r.growth) + '</div>' : '') +
    (r.mixed.length ? '<div class="rep-sec"><h3><i style="background:var(--purple)"></i>Where people disagree</h3>' + r.mixed.map(t => '<div class="theme"><b>' + esc(t.theme) + '</b><span></span><p>' + esc(t.detail) + '</p></div>').join('') + '</div>' : '') +
    (r.questions.length ? '<div class="rep-sec"><h3><i style="background:var(--blue)"></i>Question by question</h3>' + r.questions.map(q => '<div class="qsum"><b>' + esc(qText(q.id)) + '</b><p>' + esc(q.summary) + '</p></div>').join('') + '</div>' : '') +
    (r.actions.length ? '<div class="rep-sec"><h3><i style="background:var(--yellow)"></i>What to do next</h3><ol class="actions">' + r.actions.map(a => '<li><span>' + esc(a) + '</span></li>').join('') + '</ol></div>' : '') +
    '<div class="rep-foot">Based on ' + plural(r.n, 'anonymous response') + '. Nothing here is a direct quote. ' + (r.removed ? plural(r.removed, 'comment') + ' removed for abuse with nothing constructive inside. ' : '') + 'Written ' + fmtDate(r.generatedAt) + '.</div>';
}
function chip(label) {
  const cls = label === 'Most people' ? 'most' : label === 'Several people' ? 'several' : 'one';
  return '<span class="chip ' + cls + '">' + esc(label) + '</span>';
}
function keyFormHtml() {
  return '<div class="locked" style="text-align:left;max-width:460px;margin:0 auto"><h2>Connect AI to write the report</h2><p style="margin:0">In preview mode the report is written in your browser with your own OpenAI key. Once the backend is live, this happens on the server and nobody needs a key.</p>' +
    '<div class="field"><label for="k">OpenAI API key</label><input class="input" id="k" type="password" placeholder="sk-..." autocomplete="off"><p class="hint">Stored only in this browser and sent only to api.openai.com.</p></div>' +
    '<div style="display:flex;gap:10px;margin-top:18px"><button class="btn primary" data-act="save-key">Save and write report</button><button class="btn ghost" data-act="cancel-key">Cancel</button></div></div>';
}
async function generate() {
  dash.loading = true; dash.error = null; dash.needKey = false;
  document.getElementById('report').innerHTML = reportHtml();
  try {
    const res = await backend(dash.id).report(dash.id, dash.key);
    dash.data = await backend(dash.id).admin(dash.id, dash.key);
    if (!dash.data.report) dash.data.report = res.report;
  } catch (e) {
    if (e.code === 'nokey') dash.needKey = true;
    else dash.error = e.message;
  }
  dash.loading = false;
  document.getElementById('report').innerHTML = reportHtml();
}
function inviteMessage(v) {
  const d = dash.data;
  return 'Hi ' + (/^spare link/i.test(v.label) ? 'there' : v.label.split(/[\s@]/)[0]) + ", I'm asking a few people for honest feedback: \"" + d.title + "\"\n\n" +
    "It's genuinely anonymous. I'll only see an AI summary of patterns once at least " + d.threshold + ' people have answered, never your actual words. It takes about three minutes.\n\n' +
    inviteUrl(d.id, v.token) + '\n\nThis link is just for you, so please don\'t forward it.';
}

// ---------- Respond ----------
let R = null;
const ansKey = () => 'unsaid:ans:' + R.id + ':' + R.token;
async function viewRespond(id, token) {
  app.innerHTML = '<div class="flow"><div class="flow-body"><div class="flow-inner"><div class="skl" style="width:50%;height:40px"></div><div class="skl" style="width:80%"></div></div></div></div>';
  if (id === 'sample') await seedSample();
  let round;
  try { round = await backend(id).invite(id, token); }
  catch (e) { return flowMessage("This link doesn't work", e.message); }
  if (round.used) return flowMessage('This link has already been used', 'Each link works once, so every voice counts the same. If you were sent this by mistake, let the sender know.');
  round.questions = round.questions.map(q => ({ ...q, prompt: fill(q.prompt, round.ownerName) }));
  R = { id, token, round, step: -1, answers: ls.get('unsaid:ans:' + id + ':' + token, {}) };
  renderFlow();
}
function flowShell(inner, progress) {
  return '<div class="flow"><div class="flow-top"><a class="logo" href="#/">' + I.mark + 'unsaid</a>' + (progress != null ? '<div class="bar"><span style="width:' + Math.round(progress * 100) + '%"></span></div>' : '') + '</div><div class="flow-body"><div class="flow-inner">' + inner + '</div></div></div>';
}
function flowMessage(title, body, extra) {
  app.innerHTML = flowShell('<h1 class="serif">' + esc(title) + '</h1><p style="font-size:18px;opacity:.8;max-width:34em">' + esc(body) + '</p>' + (extra || ''));
}
const ABUSE = /\b(c+u+n+t+s?|f+u+c+k+\w*|f\*+\w*|sh[i1]t\w*|idiot\w*|moron\w*|retard\w*|dickhead\w*|arse?hole\w*|asshole\w*|bitch\w*|twat\w*|wanker\w*|prick\w*|useless|pathetic|stupid)\b/i;
function renderFlow() {
  const { round, step, answers } = R;
  const qs = round.questions;
  const owner = esc(round.ownerName);
  if (step === -1) {
    const li = (col, ic, t) => '<li>' + tile(col, ic) + '<span>' + t + '</span></li>';
    app.innerHTML = flowShell('<span class="eyebrow"><i></i>' + owner + ' wants your honest take</span><h1 class="serif">' + esc(round.title) + '</h1>' +
      '<ul class="promise">' +
      li('green', I.lock, 'Nothing is released until <b>' + round.threshold + ' people</b> have answered.') +
      li('purple', I.quote, owner + ' never sees your words. Only an AI summary of patterns across everyone.') +
      li('blue', I.eye, "Your answers aren't linked to this link, your name or the time you answered.") +
      li('yellow', I.shield, 'Be candid, be specific. Insults get filtered out; the point behind them stays.') +
      '</ul><button class="btn primary" data-act="go">Start · ' + plural(qs.length, 'question') + ', about 3 minutes ' + I.arrow + '</button>', 0);
    return;
  }
  if (step >= qs.length) {
    app.innerHTML = flowShell('<div class="qn">All done</div><div class="qtext">Ready to send?</div><p style="opacity:.8;font-size:17px">Your answers will be mixed in with everyone else\'s. You can\'t edit them after this.</p>' +
      '<div class="err hide" id="s-err"></div><div class="flow-nav"><button class="btn ghost" data-act="prev">' + I.left + ' Back</button><button class="btn primary" data-act="submit">Send anonymously ' + I.arrow + '</button></div>', 1);
    return;
  }
  const q = qs[step];
  const v = answers[q.id];
  let input;
  if (q.type === 'scale') {
    input = '<div class="scale" role="radiogroup">' + SCALE_LABELS.map((l, i) => '<button role="radio" aria-checked="' + (v === i + 1) + '" class="' + (v === i + 1 ? 'on' : '') + '" data-act="pick" data-v="' + (i + 1) + '"><b>' + (i + 1) + '</b><span>' + l + '</span></button>').join('') + '</div>';
  } else {
    input = '<textarea class="textarea" id="ans" maxlength="' + LIMITS.text + '" placeholder="Type your answer…">' + esc(v || '') + '</textarea>' +
      '<div class="nudge' + (ABUSE.test(v || '') ? '' : ' hide') + '" id="nudge">This will be filtered out unless there\'s a point in it. What\'s the behaviour behind it, and what would help?</div>';
  }
  const canNext = q.type === 'scale' ? !!v : true;
  const nextLabel = q.type === 'text' && !(v || '').trim() ? 'Skip' : 'Next';
  app.innerHTML = flowShell('<div class="qn">' + (step + 1) + ' of ' + qs.length + (q.type === 'text' ? ' <span class="muted" style="font-weight:400">· optional</span>' : '') + '</div><div class="qtext">' + esc(q.prompt) + '</div>' + input +
    '<div class="flow-nav"><button class="btn ghost" data-act="prev">' + I.left + ' Back</button><button class="btn primary" id="next" data-act="next"' + (canNext ? '' : ' disabled') + '>' + nextLabel + ' ' + I.arrow + '</button>' +
    '<span class="kbd">' + (q.type === 'scale' ? 'Press <kbd>1</kbd>–<kbd>5</kbd>' : 'Press <kbd>⌘</kbd>+<kbd>Enter</kbd>') + '</span></div>', (step + 1) / (qs.length + 1));
  const ta = document.getElementById('ans');
  if (ta && matchMedia('(hover: hover)').matches) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
function flowStep(d) {
  R.step = Math.max(-1, Math.min(R.round.questions.length, R.step + d));
  renderFlow();
  window.scrollTo(0, 0);
}
async function submitFlow(btn) {
  const err = document.getElementById('s-err');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Sending';
  try {
    await backend(R.id).submit(R.id, R.token, R.answers);
    raw.del(ansKey());
    app.innerHTML = flowShell('<div class="tile" style="background:var(--green);width:56px;height:56px;border-radius:18px">' + I.check.replace('width="16" height="16"', 'width="26" height="26"') + '</div>' +
      '<h1 class="serif">Sent. Thank you.</h1><p style="font-size:18px;opacity:.8;max-width:32em">Your answers are now mixed in with everyone else\'s. ' + esc(R.round.ownerName) + ' will see a summary once ' + R.round.threshold + ' people have answered.</p>' +
      '<div class="panel" style="margin-top:36px"><h2 style="font-size:22px">Want honest feedback of your own?</h2><p>Set up a round for yourself in three minutes. Free, no account.</p><div style="margin-top:16px"><a class="btn dark" href="#/">See how it works ' + I.arrow + '</a></div></div>' +
      (R.id === 'sample' ? '<p style="margin-top:20px"><a class="link" href="#/r/sample/demo">Back to the sample dashboard</a></p>' : ''), 1);
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hide');
    btn.disabled = false;
    btn.innerHTML = 'Send anonymously ' + I.arrow;
  }
}

// ---------- Errors / modals ----------
function errorPage(msg) {
  app.innerHTML = nav() + '<main class="page"><div class="narrow"><div class="page-head"><a class="back" href="#/">' + I.left + ' Home</a><h1 class="serif">Can\'t open this round</h1><p>' + esc(msg) + '</p></div></div></main>';
}
function modal(html) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="panel">' + html + '<div style="margin-top:20px"><button class="btn dark" data-act="close-modal">Got it</button></div></div>';
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
}

// ---------- Events ----------
document.addEventListener('click', async e => {
  const s = e.target.closest('[data-scroll]');
  if (s) {
    if (!document.getElementById(s.dataset.scroll)) { location.hash = '#/'; await new Promise(r => setTimeout(r, 50)); }
    const el = document.getElementById(s.dataset.scroll);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, i = Number(b.dataset.i);
  switch (act) {
    case 'tpl': {
      draft = newDraft(b.dataset.id); saveDraft();
      document.querySelectorAll('.tpl').forEach(t => t.classList.toggle('on', t === b));
      document.getElementById('form').innerHTML = formHtml(); sizeTextareas();
      document.getElementById('form').scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'qtype': draft.questions[i].type = b.dataset.type; saveDraft(); rerenderForm(); break;
    case 'qdel': draft.questions.splice(i, 1); if (!draft.questions.length) draft.questions.push({ type: 'text', prompt: '' }); saveDraft(); rerenderForm(); break;
    case 'qadd': {
      draft.questions.push({ type: b.dataset.type, prompt: '' }); saveDraft(); rerenderForm();
      const all = document.querySelectorAll('.q textarea'); all[all.length - 1].focus();
      break;
    }
    case 'th': draft.threshold = Math.max(MIN_THRESHOLD, Math.min(10, draft.threshold + Number(b.dataset.d))); saveDraft(); rerenderForm(); break;
    case 'create': createRound(b); break;
    case 'copy-link': copy(inviteUrl(dash.data.id, dash.invites[i].token), 'Link copied for ' + dash.invites[i].label); break;
    case 'copy-msg': copy(inviteMessage(dash.invites[i]), 'Message copied for ' + dash.invites[i].label); break;
    case 'share': try { await navigator.share({ title: dash.data.title, text: inviteMessage(dash.invites[i]) }); } catch (err) {} break;
    case 'copy-all': copy(dash.invites.map(v => v.label + ': ' + inviteUrl(dash.data.id, v.token)).join('\n'), 'All links copied'); break;
    case 'copy-admin': copy(adminUrl(dash.id, dash.key), 'Dashboard link copied. Keep it private.'); break;
    case 'gen': generate(); break;
    case 'print': window.print(); break;
    case 'save-key': {
      const k = document.getElementById('k').value.trim();
      if (!k) return;
      raw.set('unsaid-openai-key', k); generate(); break;
    }
    case 'cancel-key': dash.needKey = false; document.getElementById('report').innerHTML = reportHtml(); break;
    case 'reset-sample': await seedSample(true); viewDashboard('sample', 'demo'); toast('Sample reset'); break;
    case 'about-preview': modal('<h2>About preview mode</h2><p style="color:var(--muted);margin-top:10px;font-size:15px">The backend isn\'t switched on yet, so every round is stored in this browser. You can build a round, open the invite links yourself on this device, answer as different people and generate the report. To send links to other people, the backend needs deploying (about five minutes). Try the <a class="link" href="#/sample">sample round</a> to see the full flow.</p>'); break;
    case 'close-modal': b.closest('.modal').remove(); break;
    case 'go': flowStep(1); break;
    case 'prev': flowStep(-1); break;
    case 'next': flowStep(1); break;
    case 'pick': {
      const q = R.round.questions[R.step];
      R.answers[q.id] = Number(b.dataset.v); ls.set(ansKey(), R.answers);
      renderFlow();
      setTimeout(() => { if (R && R.round.questions[R.step] === q) flowStep(1); }, 260);
      break;
    }
    case 'submit': submitFlow(b); break;
  }
});
function rerenderForm() { document.getElementById('form').innerHTML = formHtml(); sizeTextareas(); }

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && draft) {
    draft[t.dataset.f] = t.value; saveDraft();
    if (t.dataset.f === 'people') { const n = peopleList().length; document.getElementById('pc').textContent = n + ' ' + (n === 1 ? 'person' : 'people'); }
  } else if (t.dataset.q != null && draft) {
    draft.questions[Number(t.dataset.q)].prompt = t.value; saveDraft();
    t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px';
  } else if (t.id === 'ans' && R) {
    const q = R.round.questions[R.step];
    R.answers[q.id] = t.value; ls.set(ansKey(), R.answers);
    document.getElementById('nudge').classList.toggle('hide', !ABUSE.test(t.value));
    const nb = document.getElementById('next');
    nb.innerHTML = (t.value.trim() ? 'Next' : 'Skip') + ' ' + I.arrow;
  }
});

document.addEventListener('keydown', e => {
  if (!R || !location.hash.startsWith('#/a/') || R.step < 0 || R.step >= R.round.questions.length) return;
  const q = R.round.questions[R.step];
  if (q.type === 'scale' && /^[1-5]$/.test(e.key) && !e.metaKey && !e.ctrlKey) {
    const btn = document.querySelector('[data-act="pick"][data-v="' + e.key + '"]');
    if (btn) btn.click();
  } else if (e.key === 'Enter' && (q.type === 'scale' ? !!R.answers[q.id] : (e.metaKey || e.ctrlKey))) {
    e.preventDefault(); flowStep(1);
  }
});

addEventListener('scroll', () => { const n = document.querySelector('.nav'); if (n) n.classList.toggle('scrolled', scrollY > 8); }, { passive: true });

// ---------- Router ----------
async function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  const [p, a, b, c] = parts;
  if (p !== 'a') R = null;
  if (p !== 'r') dash = null;
  window.scrollTo(0, 0);
  if (!p) { app.innerHTML = viewLanding(); }
  else if (p === 'new') { app.innerHTML = viewCreate(); sizeTextareas(); }
  else if (p === 'rounds') { app.innerHTML = viewMine(); }
  else if (p === 'sample') { await seedSample(); location.replace('#/r/sample/demo'); }
  else if (p === 'r' && a && b) { await viewDashboard(a, b, c === 'new'); }
  else if (p === 'a' && a && b) { await viewRespond(a, b); }
  else { app.innerHTML = viewLanding(); }
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
