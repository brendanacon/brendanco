name = "unsaid-api"
main = "worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "UNSAID"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGINS = "https://brendanco.com,https://www.brendanco.com"
OPENAI_MODEL = "gpt-5.5"

# Secret, set with: npx wrangler secret put OPENAI_API_KEY
