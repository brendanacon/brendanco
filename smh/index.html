<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SMH Reader</title>
<meta name="description" content="A clean reader for The Sydney Morning Herald.">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a1633" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1633" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SMH">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png?v=2" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #0a1633;
  --ink-2: #555b66;
  --ink-3: #767676;
  --rule: #dde1e7;
  --nav: #0a1633;
  --live: #d61f2b;
  --accent: #096dd2;
  --accent-soft: #e7f0fb;
  --read: #8a8a8a;
  --shadow: 0 1px 2px rgba(20, 24, 32, .06), 0 4px 16px rgba(20, 24, 32, .05);
  --serif: 'Source Serif 4', 'PT Serif', Georgia, serif;   /* headlines (SMH uses Abril Titling) */
  --text: 'PT Serif', Georgia, 'Times New Roman', serif;  /* intros and body copy */
  --sans: 'PT Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --reader-size: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417;
    --surface: #1a1d22;
    --ink: #ebe8e1;
    --ink-2: #b7b9be;
    --ink-3: #868a93;
    --rule: #2a2e35;
    --accent: #5ea8ff;
    --accent-soft: #1d2638;
    --read: #6b6f78;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #121417;
  --surface: #1a1d22;
  --ink: #ebe8e1;
  --ink-2: #b7b9be;
  --ink-3: #868a93;
  --rule: #2a2e35;
  --accent: #5ea8ff;
  --accent-soft: #1d2638;
  --read: #6b6f78;
  --shadow: none;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

/* --- Top bar --- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
  padding-top: env(safe-area-inset-top);
  box-shadow: inset 0 calc(env(safe-area-inset-top) + 1px) 0 var(--nav);
}
.topbar-row { display: flex; align-items: center; gap: 6px; height: 56px; background: var(--nav); color: #fff;
  box-shadow: 0 0 0 100vmax var(--nav); clip-path: inset(0 -100vmax); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; min-width: 0; }
.masthead { height: 20px; width: auto; display: block; color: #fff; }
.brand-sub { font-size: 12px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff;
}
.icon-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding: 0 16px; margin: 0 -16px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; padding: 12px 10px 10px; font-size: 14px; font-weight: 600; color: var(--ink-2);
  border-bottom: 3px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab { font-family: var(--sans); font-size: 15px; font-weight: 700; }

/* --- Feed --- */
.feed-head { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; }
.search {
  flex: 1; min-width: 0; height: 40px; border-radius: 4px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  padding: 0 12px; font: inherit; font-size: 15px;
}
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.status { font-size: 13px; color: var(--ink-3); padding: 4px 0 10px; min-height: 24px; }
.status.err { color: #c0392b; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 12px; }
.chip {
  font-size: 12px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--rule); color: var(--ink-2); background: var(--surface);
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.meta { font-size: 13px; color: var(--ink-3); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-family: var(--sans); }
.kicker { font-size: 14px; font-weight: 500; color: var(--accent); margin-bottom: 8px; }
.ready-slot:empty { display: none; }
.dot-ready { width: 6px; height: 6px; border-radius: 50%; background: #2e9d6a; display: inline-block; }

/* Story cards, modelled on smh.com.au's mobile homepage */
.c { display: block; padding: 20px 0; border-top: 1px solid var(--rule); text-decoration: none; cursor: pointer; }
.mod-body > .c:first-child, .mod-first > .c:first-child, #list > .c:first-child { border-top: 0; }
.kick { font-size: 15px; line-height: 1.3; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 0 10px; align-items: center; }
.kick .lbl.live { color: var(--live); display: inline-flex; align-items: center; gap: 6px; }
.kick .lbl.live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 4px color-mix(in srgb, var(--live) 14%, transparent); }
.kick .lbl { font-weight: 700; color: var(--ink); }
.kick .tag { font-weight: 400; color: var(--accent); }
.c h3 { font-family: var(--serif); font-weight: 700; letter-spacing: -0.012em; line-height: 1.16; color: var(--ink); text-wrap: pretty; }
.s28 h3 { font-size: 30px; line-height: 1.1; }
.s24 h3 { font-size: 24px; }
.s20 h3 { font-size: 20px; line-height: 1.2; }
.s16 h3 { font-size: 16px; line-height: 1.28; }
.c .intro { font-family: var(--text); font-size: 17px; line-height: 1.45; color: var(--ink-2); margin-top: 10px; }
.c .by { font-size: 15px; color: var(--accent); margin-top: 10px; }
.c img { display: block; object-fit: cover; background: var(--rule); }
.c .row { display: grid; grid-template-columns: 1fr 80px; gap: 16px; align-items: start; }
.c .row img { width: 80px; height: 80px; }
.c.wide .row { grid-template-columns: 1fr 160px; }
.c.wide .row img { width: 160px; height: 107px; }
.c .img-above { width: 100%; aspect-ratio: 3 / 2; margin-bottom: 14px; }
.c .img-below { width: 100%; aspect-ratio: 16 / 9; margin-top: 14px; }
.c.compact { padding: 14px 0; }
.is-read h3 { color: var(--read); }
.c:hover h3 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }

/* Homepage modules */
.mod { margin-top: 8px; }

/* AI briefing + article summary */
.ai { border: 1px solid var(--rule); border-top: 4px solid var(--nav); padding: 16px 16px 14px; margin: 14px 0 6px; background: var(--surface); }
.ai-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.ai-head svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.ai-head .spacer { flex: 1; }
.ai-head button { font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--accent); padding: 4px 2px; }
.ai-take { font-family: var(--serif); font-size: 19px; line-height: 1.32; font-weight: 700; margin: 12px 0 2px; }
.ai ul { list-style: none; margin: 10px 0 0; padding: 0; }
.ai li { position: relative; padding: 0 0 0 16px; margin: 0 0 12px; font-family: var(--text); font-size: 17px; line-height: 1.45; color: var(--ink); }
.ai li::before { content: ''; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; background: var(--accent); }
.ai li b { font-weight: 700; }
.ai .refs { display: block; margin-top: 4px; font-family: var(--sans); font-size: 13px; line-height: 1.4; }
.ai .refs a { color: var(--accent); text-decoration: none; }
.ai .refs a + a::before { content: ' · '; color: var(--ink-3); }
.ai-watch { font-size: 14px; line-height: 1.45; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 4px; }
.ai-watch b { color: var(--ink); }
.ai-foot { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.ai-msg { font-size: 15px; line-height: 1.45; color: var(--ink-2); margin-top: 10px; }
.ai-msg button { color: var(--accent); font-weight: 600; }
.ai .skl { height: 14px; background: var(--rule); margin: 12px 0; animation: pulse 1.2s ease-in-out infinite; }
.ai .skl:nth-child(odd) { width: 86%; }
@keyframes pulse { 50% { opacity: .45; } }
.ai.collapsed ul, .ai.collapsed .ai-take, .ai.collapsed .ai-watch, .ai.collapsed .ai-foot { display: none; }
.story .ai { margin: 18px 0 24px; }
.sum-toggle { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; color: inherit; }
.sum-toggle .state { font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.sum-toggle .state.ready { color: var(--accent); }
.sum-toggle .chev { width: 18px; height: 18px; color: var(--ink-2); transition: transform .2s; }
.ai.sum.open .chev { transform: rotate(180deg); }
.ai.sum:not(.open) .sum-body { display: none; }
.ai.sum:not(.open) { padding-bottom: 16px; }
.sum-modes { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; margin: 12px 0 2px; }
.sum-modes button { font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; color: var(--ink-2); }
.sum-modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.spin-dot { width: 10px; height: 10px; border: 2px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: -1px; margin-right: 4px; }
/* swipe between stories */
#reader { touch-action: pan-y; }
#reader.slide-l { animation: slideL .22s ease-out; }
#reader.slide-r { animation: slideR .22s ease-out; }
@keyframes slideL { from { transform: translateX(40px); opacity: .3; } }
@keyframes slideR { from { transform: translateX(-40px); opacity: .3; } }
.swipe-hint { font-size: 12px; color: var(--ink-3); text-align: center; margin-top: 18px; }

/* Settings sheet */
dialog#settings, dialog#linkDlg { border: 0; padding: 0; margin: auto; width: min(460px, calc(100% - 24px)); background: var(--bg); color: var(--ink); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog#settings::backdrop, dialog#linkDlg::backdrop { background: rgba(0,0,0,.45); }
.sheet { padding: 20px; display: grid; gap: 12px; }
.sheet h2 { font-family: var(--serif); font-size: 22px; }
.fld { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fld input { height: 42px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 12px; font: inherit; font-size: 16px; font-weight: 400; background: var(--surface); color: var(--ink); }
.chk { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.hint { font-size: 13px; line-height: 1.45; color: var(--ink-3); margin-top: -4px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.row-btns .spacer { flex: 1; }
.recent { margin-top: 6px; border-top: 1px solid var(--rule); padding-top: 12px; }
.recent h3 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
.recent a { display: block; padding: 9px 0; border-bottom: 1px solid var(--rule); text-decoration: none; }
.recent a b { display: block; font-family: var(--serif); font-weight: 700; font-size: 16px; line-height: 1.25; }
.recent a span { font-size: 12px; color: var(--ink-3); }
#linkErr { color: #c0392b; }
body.on-home .feed-head { display: none; }
body.on-home .status { padding-top: 12px; }
.mh { border-top: 2px solid var(--ink); margin-top: 32px; padding: 14px 0 2px; font-family: var(--sans); font-size: 22px; font-weight: 400; letter-spacing: 0; color: var(--ink-2); }
.mod-sep { border-top: 1px solid var(--rule); }
.hgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 16px; padding: 22px 0; border-top: 1px solid var(--rule); }
.hgrid .c { border: 0; padding: 0; }
.hgrid .img-above { aspect-ratio: 16 / 9; margin-bottom: 12px; }

/* Day dividers in the chronological tabs */
.day { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink);
  padding: 14px 0 2px; margin-top: 28px; border-top: 2px solid var(--ink); }
.day + .c { border-top: 0; }
#list > .day:first-child { margin-top: 4px; }
.empty { padding: 60px 0; text-align: center; color: var(--ink-3); font-size: 15px; }
.skel { height: 110px; border-top: 1px solid var(--rule); position: relative; overflow: hidden; }
.skel::after { content: ''; position: absolute; inset: 18px 130px 18px 0; border-radius: 6px;
  background: linear-gradient(90deg, var(--rule), color-mix(in srgb, var(--rule) 40%, transparent), var(--rule));
  background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }

/* --- Reader --- */
#reader { display: none; }
body.reading #reader { display: block; }
body.reading #feed { display: none; }
body.reading .tabs { display: none; }

.progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0; z-index: 30; transition: width .1s linear; }
article.story { padding: 28px 0 80px; }
.story .kicker { margin-bottom: 12px; }
.story-kick { margin-bottom: 14px; font-size: 16px; }
/* live blog posts */
.body .post { border-top: 1px solid var(--rule); padding-top: 18px; margin-top: 26px; }
.body .post-time { font-family: var(--sans); font-size: 14px; font-weight: 700; color: var(--live); margin: 0 0 4px; display: flex; gap: 10px; }
.body .post-time span { color: var(--ink-3); font-weight: 400; }
.body .post h3 { font-family: var(--serif); font-weight: 700; font-size: 1.15em; line-height: 1.25; margin: 0 0 .5em; }
.body .live-note { font-family: var(--sans); font-size: 14px; color: var(--ink-2); background: var(--accent-soft); padding: 10px 12px; }
.body cite { display: block; font-family: var(--sans); font-style: normal; font-size: 14px; font-weight: 400; color: var(--ink-3); margin-top: 6px; }
.story h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(30px, 6vw, 42px); line-height: 1.1; letter-spacing: -0.015em; text-wrap: balance; }
.story .standfirst { font-family: var(--text); font-size: 21px; line-height: 1.4; color: var(--ink-2); margin-top: 14px; }
.byline { display: flex; align-items: center; gap: 12px; margin: 22px 0; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.byline img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--rule); }
.byline .who { font-size: 14px; font-weight: 600; }
.byline .when { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.story figure { margin: 26px 0; }
.story figure img { width: 100%; height: auto; aspect-ratio: var(--ar, 3 / 2); object-fit: cover; border-radius: 0; display: block; background: var(--rule); }
.story figcaption { font-size: 13px; line-height: 1.45; color: var(--ink-3); margin-top: 8px; }
.story figcaption .credit { opacity: .8; }
.story .hero { margin: 0 0 8px; }

.body { font-family: var(--text); font-size: var(--reader-size); line-height: 1.62; color: var(--ink); }
.body p { margin: 0 0 1.05em; }
.body h2 { font-family: var(--sans); font-size: .9em; font-weight: 700; letter-spacing: -0.005em; margin: 1.8em 0 .6em; }
.body a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.body blockquote { border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; margin: 1.6em 0; font-size: 1.12em; font-weight: 600; color: var(--ink); }
.body blockquote p { margin: 0; }
.body .embed { margin: 1.6em 0; border-radius: 10px; overflow: hidden; background: var(--surface); border: 1px solid var(--rule); }
.body .embed iframe { width: 100%; height: 480px; border: 0; display: block; background: #fff; }

.story-foot { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface);
  text-decoration: none; color: var(--ink-2);
}
.pill:hover { color: var(--ink); border-color: var(--ink-3); }
.pill.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.nextup { margin-top: 36px; }
.nextup .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }

.fail { padding: 40px 0; }
.fail h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin-bottom: 10px; }
.fail p { color: var(--ink-2); line-height: 1.5; margin-bottom: 18px; font-size: 15px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); font-size: 14px; padding: 10px 16px; border-radius: 10px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 520px) {
  .brand-sub { display: none; }
  .story .standfirst { font-size: 19px; }
  .body .embed iframe { height: 380px; }
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<header class="topbar">
  <div class="wrap">
    <div class="topbar-row">
      <button class="icon-btn" id="backBtn" aria-label="Back to feed" hidden>

<script>
(function() {
  'use strict';

  // ---------- Config ----------
  const SITE = 'https://www.smh.com.au';
  const FEEDS = [
    { id: 'home',        name: 'Home',        url: SITE + '/', home: true },
    { id: 'latest',      name: 'Latest',      url: SITE + '/rss/feed.xml' },
    { id: 'nsw',         name: 'NSW',         url: SITE + '/rss/national/nsw.xml' },
    { id: 'politics',    name: 'Politics',    url: SITE + '/rss/politics/federal.xml' },
    { id: 'opinion',     name: 'Opinion',     url: SITE + '/opinion', tagPage: true },
    { id: 'national',    name: 'National',    url: SITE + '/rss/national.xml' },
    { id: 'business',    name: 'Business',    url: SITE + '/rss/business.xml' },
    { id: 'world',       name: 'World',       url: SITE + '/rss/world.xml' },
    { id: 'sport',       name: 'Sport',       url: SITE + '/rss/sport.xml' },
    { id: 'culture',     name: 'Culture',     url: SITE + '/rss/culture.xml' },
    { id: 'lifestyle',   name: 'Lifestyle',   url: SITE + '/rss/lifestyle.xml' },
    { id: 'property',    name: 'Property',    url: SITE + '/rss/property.xml' },
    { id: 'technology',  name: 'Technology',  url: SITE + '/rss/technology.xml' },
    { id: 'environment', name: 'Environment', url: SITE + '/rss/environment.xml' },
    { id: 'traveller',   name: 'Traveller',   url: SITE + '/rss/traveller.xml' },
    { id: 'goodfood',    name: 'Good Food',   url: SITE + '/rss/goodfood.xml' },
  ];
  const PROXIES = [
    { name: 'cf-worker', url: u => 'https://rss-proxy.brendanaconnaughton.workers.dev/?url=' + encodeURIComponent(u) },
    { name: 'corsproxy', url: u => 'https://corsproxy.io/?' + encodeURIComponent(u) },
    { name: 'allorigins', url: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
  ];
  const TIMEOUT_MS = 15000;
  const PREFETCH_COUNT = 12;       // warm the cache for the top N stories in the current tab
  const PREFETCH_CONCURRENCY = 3;
  const MAX_CACHED_ARTICLES = 100;
  const ARCHIVE_MAX = 250;         // stories kept per tab
  const ARCHIVE_DAYS = 14;
  const STORE = {
    feed: id => 'smh-feed-' + id,
    articles: 'smh-articles-v1',
    read: 'smh-read',
    tab: 'smh-tab',
    size: 'smh-size',
    theme: 'smh-theme',
    opened: 'smh-opened',
    key: 'smh-openai-key',
    model: 'smh-openai-model',
    aiPrefs: 'smh-ai-prefs',
    sums: 'smh-ai-summaries',
    brief: id => 'smh-ai-brief-' + id,
  };
  const DEFAULT_MODEL = 'gpt-5.5';
  const img = (id, w) => 'https://static.ffx.io/images/$width_' + (w || 800) + '/t_resize_width/q_86%2Cf_auto/' + id;

  // ---------- Storage helpers (never throw) ----------
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  };

  // ---------- State ----------
  let currentTab = tabFromHash() || 'home';
  let homeModules = [];           // homepage layout: [{ heading, kind, showHeading, ids }]
  let items = [];                 // items in the current tab
  let categoryFilter = null;
  const memArticles = new Map();  // id -> parsed article (session)
  const inflight = new Map();     // id -> promise
  let readSet = new Set(store.get(STORE.read, []));
  let workingProxy = 0;

  const $ = id => document.getElementById(id);
  const listEl = $('list'), statusEl = $('status'), chipsEl = $('chips'), readerEl = $('reader');

  // ---------- Networking ----------
  async function fetchWithTimeout(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.text();
    } catch (e) {
      throw new Error(e.name === 'AbortError' ? 'timed out' : e.message);
    } finally { clearTimeout(t); }
  }

  // Try the last proxy that worked first, then the rest.
  async function fetchText(url, validate) {
    const order = PROXIES.map((_, i) => (workingProxy + i) % PROXIES.length);
    const errors = [];
    for (const i of order) {
      try {
        const text = await fetchWithTimeout(PROXIES[i].url(url));
        if (validate && !validate(text)) throw new Error('unexpected response');
        workingProxy = i;
        return text;
      } catch (e) { errors.push(PROXIES[i].name + ': ' + e.message); }
    }
    throw new Error(errors.join(' · '));
  }

  function cleanLink(link) {
    try { const u = new URL(link); u.search = ''; u.hash = ''; return u.toString(); } catch (e) { return link; }
  }
  function idFromLink(link) {
    const m = /-(p[0-9a-z]{5,6})(?:\.html)?(?:[/?#]|$)/i.exec(link);
    return m ? m[1] : null;
  }

  // ---------- Feed ----------
  function parseFeed(xml) {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    return Array.from(doc.querySelectorAll('item')).map(it => {
      const txt = sel => { const n = it.getElementsByTagName(sel)[0]; return n ? n.textContent.trim() : ''; };
      const link = cleanLink(txt('link'));
      const enc = it.getElementsByTagName('enclosure')[0];
      return {
        id: idFromLink(link) || txt('guid') || link,
        link,
        title: txt('title'),
        desc: txt('description'),
        category: txt('category'),
        author: txt('dc:creator') || txt('creator'),
        image: enc ? enc.getAttribute('url') : '',
        date: txt('pubDate'),
      };
    }).filter(i => i.title && i.link);
  }

  // SMH's feeds only carry their newest 20 items and can't be paged, so each tab keeps
  // an on-device archive: every refresh merges into it instead of replacing it.
  function mergeItems(oldItems, fresh) {
    const byId = new Map();
    (oldItems || []).forEach(i => byId.set(i.id, i));
    fresh.forEach(i => byId.set(i.id, i));
    const cutoff = Date.now() - ARCHIVE_DAYS * 864e5;
    return Array.from(byId.values())
      .map(i => ({ i, t: (parseDate(i.date) || new Date(0)).getTime() }))
      .filter(x => x.t >= cutoff)
      .sort((a, b) => b.t - a.t)
      .slice(0, ARCHIVE_MAX)
      .map(x => x.i);
  }

  function saveArchive(id, list, extra) {
    const entry = Object.assign({ at: Date.now(), items: list }, extra || {});
    if (!store.set(STORE.feed(id), entry)) {
      // Storage full: give the space back from the article cache first, then retry smaller.
      store.set(STORE.articles, {});
      entry.items = list.slice(0, Math.floor(ARCHIVE_MAX / 2));
      store.set(STORE.feed(id), entry);
    }
  }

  // smh.com.au ships every index page (home, sections, Opinion) as
  // window.INITIAL_STATE = JSON.parse("…"): a JSON string holding the page's JSON.
  function pageState(html) {
    const marker = 'window.INITIAL_STATE = JSON.parse(';
    const start = html.indexOf(marker);
    if (start === -1) throw new Error('page data not found');
    const q = start + marker.length;
    if (html[q] !== '"') throw new Error('page data in an unexpected format');
    let i = q + 1;
    for (; i < html.length; i++) { const ch = html[i]; if (ch === '\\') i++; else if (ch === '"') break; }
    const state = JSON.parse(JSON.parse(html.slice(q, i + 1)));
    const pages = state.page || {};
    const pg = pages[Object.keys(pages).find(k => pages[k] && pages[k].index) || ''];
    if (!pg || !pg.index) throw new Error('page layout not found');
    return pg.index.contentUnitGroups || [];
  }

  // Opinion: one long list of the latest columns.
  function parseTagPage(html, feed) {
    const seen = new Set(), out = [];
    pageState(html).forEach(g => (g.contentUnits || []).forEach(cu => (cu.assets || []).forEach(a => {
      if (!a || !STORY_TYPES.has(a.assetType) || seen.has(a.id)) return;
      seen.add(a.id);
      const st = homeStory(a);
      if (st.title) out.push(st);
    })));
    return out;
  }

  async function fetchFeedItems(feed) {
    if (feed.tagPage) {
      const list = parseTagPage(await fetchText(feed.url, t => t.indexOf('INITIAL_STATE') !== -1), feed);
      if (!list.length) throw new Error(feed.name + ' had no stories');
      return list;
    }
    const xml = await fetchText(feed.url, t => /<item[\s>]/.test(t));
    const list = parseFeed(xml);
    if (!list.length) throw new Error(feed.name + ' feed was empty');
    return list;
  }

  const STORY_TYPES = new Set(['article', 'featureArticle', 'liveArticle']);

  // ---------- Homepage ----------
  function cropOf(fi, key) {
    const d = fi && fi[key] && fi[key].data;
    return d && d.id ? [d.id, +(+d.zoom || 1).toFixed(6), d.cropWidth || 0, d.offsetX || 0, d.offsetY || 0, d.aspect || 1] : null;
  }
  function cropUrl(c, w) {
    if (!c) return '';
    if (!c[2]) return img(c[0], w);
    return 'https://static.ffx.io/images/$zoom_' + c[1] + '%2C$multiply_' + (w / c[2]).toFixed(4) + '%2C$ratio_' + c[5] +
      '%2C$width_' + c[2] + '%2C$x_' + c[3] + '%2C$y_' + c[4] + '/t_crop_custom/q_86%2Cf_auto/' + c[0];
  }

  function homeStory(a) {
    const fi = a.featuredImages || {};
    const path = a.urls && ((a.urls.canonical && a.urls.canonical.path) || (a.urls.published && a.urls.published.smh && a.urls.published.smh.path));
    const tag = a.tags && a.tags.primary ? a.tags.primary.displayName : ((a.category && a.category.name) || '');
    const authors = ((a.participants && a.participants.authors) || []).map(x => x.name).filter(Boolean);
    const sq = cropOf(fi, 'square1x1'), l32 = cropOf(fi, 'landscape3x2'), l169 = cropOf(fi, 'landscape16x9');
    const id = a.shortId || a.id;
    return {
      id,
      link: path ? SITE + path : SITE + '/link/follow-20180101-' + id,
      title: (a.asset && a.asset.headlines && a.asset.headlines.headline) || (a.headlines && a.headlines.headline) || '',
      desc: (a.asset && a.asset.about) || a.about || '',
      tag, label: a.label || (a.assetType === 'liveArticle' ? 'Live' : ''),
      category: (a.category && a.category.name) || tag,
      author: (a.asset && a.asset.byline) || authors.join(', '),
      date: (a.dates && (a.dates.published || a.dates.firstPublished)) || '',
      sq, l32, l169,
      image: cropUrl(l169 || l32 || sq, 640),
    };
  }

  // Modules in the order smh.com.au stacks them on a phone: the news wells ("story sets")
  // first, then Just in / Editor's Picks, then the section blocks.
  function parseHome(html) {
    const groups = pageState(html);
    const modules = [], byId = new Map();
    groups.forEach(g => (g.contentUnits || []).forEach(cu => {
      const cfg = cu.config || {};
      const layout = ((cfg.displayConfiguration || {}).layout || {}).name || '';
      const stories = (cu.assets || []).filter(a => a && STORY_TYPES.has(a.assetType) && a.id).map(homeStory).filter(x => x.title);
      if (!stories.length || cu.typeName !== 'assetlist' && cu.typeName !== 'tags-or-categories-with-exclusions') return;
      const heading = cfg.heading || '';
      let kind;
      if (cu.typeName === 'tags-or-categories-with-exclusions') kind = 'column';
      else if (/^StorySet/.test(layout) && !heading) kind = 'storyset';
      else kind = 'section';
      const over = {};
      stories.forEach(st => {
        const first = byId.get(st.id);
        if (!first) byId.set(st.id, st);
        else if (first.title !== st.title || first.desc !== st.desc) over[st.id] = [st.title, st.desc];
      });
      const mod = { heading, kind, showHeading: !!heading, ids: stories.map(x => x.id) };
      if (kind === 'storyset' && !modules.some(m => m.kind === 'storyset')) mod.lead = true;
      if (Object.keys(over).length) mod.over = over;
      modules.push(mod);
    }));
    if (!modules.length) throw new Error('homepage had no stories');
    return { modules, items: Array.from(byId.values()) };
  }

  async function loadHome(force) {
    const cached = store.get(STORE.feed('home'), null);
    if (cached && cached.items && cached.modules) {
      items = cached.items; homeModules = cached.modules;
      renderList();
      setStatus('Front page · updated ' + timeAgo(cached.at));
    } else {
      items = []; homeModules = [];
      renderSkeleton();
      setStatus('Loading the front page…');
    }
    if (!force && cached && Date.now() - cached.at < 3 * 60 * 1000) { prefetchTop(); return; }
    spin(true);
    try {
      const html = await fetchText(SITE + '/', t => t.indexOf('INITIAL_STATE') !== -1);
      const home = parseHome(html);
      if (!store.set(STORE.feed('home'), { at: Date.now(), items: home.items, modules: home.modules })) {
        store.set(STORE.articles, {});
        store.set(STORE.feed('home'), { at: Date.now(), items: home.items, modules: home.modules });
      }
      if (currentTab !== 'home') return;
      items = home.items; homeModules = home.modules;
      renderList();
      setStatus('Front page · updated just now');
      prefetchTop();
    } catch (e) {
      if (currentTab !== 'home') return;
      if (items.length) setStatus('Offline copy — refresh failed (' + e.message + ')', true);
      else { listEl.innerHTML = '<div class="empty">Couldn’t load the front page.<br><small>' + esc(e.message) + '</small></div>'; setStatus('', true); }
    } finally { spin(false); }
  }

  async function loadFeed(force) {
    if (currentTab === 'home') return loadHome(force);
    const feed = FEEDS.find(f => f.id === currentTab);
    const cached = store.get(STORE.feed(feed.id), null);
    if (cached && cached.items && cached.items.length) {
      items = cached.items;
      renderList();
      setStatus(items.length + ' stories · updated ' + timeAgo(cached.at));
    } else {
      items = [];
      renderSkeleton();
      setStatus('Loading ' + feed.name + '…');
    }
    if (!force && cached && Date.now() - cached.at < 3 * 60 * 1000) { prefetchTop(); return; }

    spin(true);
    try {
      // Latest = the front-page feed plus every section feed, which catches far more
      // of the day's stories than the single 20-item feed.
      const sources = feed.id === 'latest' ? FEEDS.filter(f => !f.home && !f.tagPage) : [feed];
      const results = await Promise.allSettled(sources.map(fetchFeedItems));
      const ok = results.filter(r => r.status === 'fulfilled');
      if (!ok.length) throw new Error(results[0].reason.message);
      let fresh = [];
      results.forEach((r, k) => {
        if (r.status !== 'fulfilled') return;
        fresh = fresh.concat(r.value);
        const src = sources[k];
        if (src.id !== feed.id) {
          const prev = store.get(STORE.feed(src.id), null);
          saveArchive(src.id, mergeItems(prev && prev.items, r.value), prev && prev.at ? { at: prev.at } : null);
        }
      });

      const prevItems = (store.get(STORE.feed(feed.id), null) || {}).items || [];
      const known = new Set(prevItems.map(i => i.id));
      const merged = mergeItems(prevItems, fresh);
      const added = prevItems.length ? merged.filter(i => !known.has(i.id)).length : 0;
      saveArchive(feed.id, merged);
      if (feed.id !== currentTab) return; // user switched tabs mid-request
      items = merged;
      renderList();
      const failed = results.length - ok.length;
      setStatus(merged.length + ' stories' + (added ? ' · ' + added + ' new' : '') + ' · updated just now' +
        (failed ? ' · ' + failed + ' section' + (failed > 1 ? 's' : '') + ' unavailable' : ''));
      prefetchTop();
    } catch (e) {
      if (feed.id !== currentTab) return;
      if (items.length) setStatus('Offline copy — refresh failed (' + e.message + ')', true);
      else { listEl.innerHTML = '<div class="empty">Couldn’t load the feed.<br><small>' + esc(e.message) + '</small></div>'; setStatus('', true); }
    } finally { spin(false); }
  }

  // ---------- Article extraction ----------
  // SMH article pages carry the story as GraphQL cache data in window.APOLLO_STATE = {…};
  // the body is a list of typed blocks (markup, images, quotes, embeds…).
  function extractArticle(html) {
    const marker = 'window.APOLLO_STATE = ';
    const start = html.indexOf(marker);
    if (start !== -1) {
      try {
        const s = start + marker.length;
        const o = JSON.parse(html.slice(s, html.indexOf(';<\/script>', s)));
        const a = fromApollo(o);
        if (a) return a;
      } catch (e) { /* fall through to JSON-LD */ }
    }
    return extractFromLdJson(html);
  }

  const RATIO = { LANDSCAPE_16_9: 16 / 9, LANDSCAPE_3_2: 1.5, PORTRAIT_2_3: 2 / 3, SQUARE_1_1: 1 };
  function fromApollo(o) {
    const deref = r => (r && r.__ref ? o[r.__ref] : r) || null;
    const root = o.ROOT_QUERY || {};
    let A = null;
    for (const k in root) { if (/^assetByPublicId/.test(k)) { A = deref(root[k] && root[k].asset); if (A && A.headlines) break; } }
    if (!A || !A.headlines) A = Object.keys(o).map(k => o[k]).find(x => x && /Asset$/.test(x.__typename || '') && x.headlines && (x.body || x.__typename === 'LiveArticleAsset')) || null;
    if (!A) return null;

    const ph = {};
    let n = 0;
    const blocksHtml = blocks => (blocks || []).map(b => blockHtml(b, ph, () => 'b' + (n++))).join('');
    const isLive = A.__typename === 'LiveArticleAsset' || A.type === 'LIVE_ARTICLE';
    let body = A.body && A.body.blocks ? blocksHtml(A.body.blocks) : '';
    if (isLive) {
      const posts = Object.keys(o).map(k => o[k]).filter(x => x && x.__typename === 'Post' && x.body)
        .sort((x, y) => new Date((y.dates || {}).published || 0) - new Date((x.dates || {}).published || 0));
      body += '<p class="live-note">Live blog · the latest ' + posts.length + ' update' + (posts.length === 1 ? '' : 's') + '. Open it on smh.com.au for the full blog.</p>';
      body += posts.map(p => {
        const when = (p.dates && (p.dates.published || p.dates.firstPublished)) || '';
        const who = (p.byline || []).map(b => b.name || (deref(b.author) || {}).name).filter(Boolean).join(', ');
        return '<div class="post"><p class="post-time">' + esc(postTime(when)) + (who ? '<span>' + esc(who) + '</span>' : '') + '</p>' +
          (p.headlines && p.headlines.headline ? '<h3>' + esc(p.headlines.headline) + '</h3>' : '') + blocksHtml(p.body.blocks) + '</div>';
      }).join('');
    }

    const authors = (A.byline || []).map(b => {
      if (b.name) return { name: b.name, avatar: '' };
      const au = deref(b.author) || {};
      return { name: au.name || '', avatar: (au.profile && au.profile.avatar) || '' };
    }).filter(x => x.name);
    const imgs = A.images || {};
    const heroR = imgs.landscape3x2 || imgs.landscape16x9 || null;
    const cat = deref(A.category);
    const tagP = A.tags && deref(A.tags.primary);
    const ov = A.overview || {};
    const path = A.urls && A.urls.canonical && A.urls.canonical.path;
    return {
      id: A.publicId || '',
      headline: A.headlines.headline || '',
      about: ov.about || ov.intro || '',
      body,
      placeholders: ph,
      byline: authors.map(x => x.name).join(', '),
      authors,
      wordCount: (A.extensions && A.extensions.wordCount) || 0,
      label: ov.label || (isLive ? 'Live' : ''),
      categories: [cat && cat.name, tagP && tagP.displayName].filter(Boolean),
      published: (A.dates && (A.dates.firstPublished || A.dates.published)) || '',
      modified: (A.dates && A.dates.modified) || '',
      hero: heroR && heroR.mediaId ? { id: heroR.mediaId, caption: heroR.caption || '', credit: heroR.credit || '', aspect: heroR === imgs.landscape3x2 ? 1.5 : 16 / 9 } : null,
      heroIds: Object.keys(imgs).map(k => imgs[k] && imgs[k].mediaId).filter(Boolean),
      url: path ? SITE + path : '',
    };
  }

  function postTime(s) {
    const d = parseDate(s);
    if (!d) return '';
    return d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit', timeZone: 'Australia/Sydney' }).replace(/\s/g, '').toLowerCase();
  }

  // One body block -> HTML, with <x-placeholder> tokens for anything buildBody() expands.
  function blockHtml(b, ph, nextId) {
    const put = p => { const id = nextId(); ph[id] = p; return '<x-placeholder id="' + id + '"></x-placeholder>'; };
    switch (b.type) {
      case 'MARKUP':
        (b.placeholders || []).forEach(p => {
          if (p.type === 'LINK_ASSET') ph[p.key] = { type: 'linkArticle', data: { id: p.assetId, text: p.text } };
          else if (p.type === 'LINK_EXTERNAL') ph[p.key] = { type: 'linkExternal', data: { url: p.url, text: p.text } };
          else if (p.text) ph[p.key] = { type: 'text', data: { text: p.text } };
        });
        return b.markup || '';
      case 'IMAGE': {
        const im = b.image || {};
        return im.mediaId ? put({ type: 'image', data: { id: im.mediaId, caption: im.caption, credit: im.credit, aspect: RATIO[im.type] || 1.5 } }) : '';
      }
      case 'QUOTE':
        return put({ type: 'quote', data: { markup: (b.markup || '') + (b.byline ? '<cite>— ' + esc(b.byline) + '</cite>' : '') } });
      case 'YOU_TUBE': {
        const m = /(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/.exec(b.url || '');
        return m ? put({ type: 'iframe', data: { url: 'https://www.youtube-nocookie.com/embed/' + m[1] } }) : '';
      }
      case 'IFRAME': case 'INSTAGRAM': case 'TWITTER': case 'TIKTOK': case 'FACEBOOK': {
        const u = b.url || '';
        // Social posts refuse to load in frames; link to them instead.
        if (b.type !== 'IFRAME' || /(tiktok|instagram|twitter|x)\.com\/|facebook\.com\//.test(u)) {
          return /^https:\/\//.test(u) ? '<p><a href="' + escAttr(u) + '">View the post on ' + esc(u.replace(/^https:\/\/(www\.)?/, '').split('/')[0]) + ' ↗</a></p>' : '';
        }
        if (/video-loop|autoplay-video/.test(u)) return ''; // decorative looping clips; blank outside smh.com.au
        return put({ type: 'iframe', data: { url: u } });
      }
      default:
        return ''; // related-story cards, Brightcove video, property listings, ads
    }
  }

  function extractFromLdJson(html) {
    const re = /<script[^>]+application\/ld\+json[^>]*>([\s\S]*?)<\/script>/g;
    let m;
    while ((m = re.exec(html))) {
      try {
        const arr = [].concat(JSON.parse(m[1]));
        for (const d of arr) {
          if (d && d.articleBody) {
            return {
              headline: d.headline || '', about: d.description || '',
              body: d.articleBody.split(/\n+/).map(p => '<p>' + esc(p) + '</p>').join(''),
              placeholders: {}, byline: [].concat(d.author || []).map(x => x.name).join(', '),
              authors: [], wordCount: 0, categories: [], label: '',
              published: d.datePublished || '', hero: null, url: '',
            };
          }
        }
      } catch (e) { /* keep looking */ }
    }
    return null;
  }

  function getCachedArticle(id) {
    if (memArticles.has(id)) return memArticles.get(id);
    const all = store.get(STORE.articles, {});
    return all[id] ? all[id].a : null;
  }

  function cacheArticle(id, a) {
    memArticles.set(id, a);
    const all = store.get(STORE.articles, {});
    all[id] = { at: Date.now(), a };
    const keys = Object.keys(all);
    if (keys.length > MAX_CACHED_ARTICLES) {
      keys.sort((x, y) => all[x].at - all[y].at).slice(0, keys.length - MAX_CACHED_ARTICLES).forEach(k => delete all[k]);
    }
    if (!store.set(STORE.articles, all)) {
      // Quota hit: keep only the newest third and try again.
      const keep = Object.keys(all).sort((x, y) => all[y].at - all[x].at).slice(0, Math.floor(MAX_CACHED_ARTICLES / 3));
      const trimmed = {}; keep.forEach(k => trimmed[k] = all[k]);
      store.set(STORE.articles, trimmed);
    }
  }

  function getArticle(id, link) {
    const cached = getCachedArticle(id);
    if (cached) return Promise.resolve(cached);
    if (inflight.has(id)) return inflight.get(id);
    const p = fetchText(link, t => t.length > 2000)
      .then(html => {
        const a = extractArticle(html);
        if (!a || !a.body) throw new Error('no article text found on the page');
        cacheArticle(id, a);
        markReady(id);
        return a;
      })
      .finally(() => inflight.delete(id));
    inflight.set(id, p);
    return p;
  }

  async function prefetchTop() {
    const queue = items.slice(0, PREFETCH_COUNT).filter(i => !getCachedArticle(i.id));
    const worker = async () => {
      while (queue.length) {
        const it = queue.shift();
        try { await getArticle(it.id, it.link); } catch (e) { /* opened on demand later */ }
      }
    };
    await Promise.all(Array.from({ length: PREFETCH_CONCURRENCY }, worker));
  }

  function markReady(id) {
    const el = listEl.querySelector('[data-id="' + cssEsc(id) + '"] .ready-slot');
    if (el && !el.firstChild) el.innerHTML = '<span class="dot-ready" title="Ready to read offline"></span>';
  }

  // ---------- Rendering: feed ----------
  function renderTabs() {
    $('tabs').innerHTML = FEEDS.map(f =>
      '<button class="tab" role="tab" data-tab="' + f.id + '" aria-selected="' + (f.id === currentTab) + '">' + f.name + '</button>'
    ).join('');
  }

  function renderSkeleton() {
    chipsEl.innerHTML = '';
    listEl.innerHTML = Array.from({ length: 6 }, () => '<div class="skel"></div>').join('');
  }

  // One story card. v = [headline size, image placement, show intro, hide kicker, show byline]
  function card(i, v, extraClass) {
    const size = v[0], place = v[1], intro = v[2], noKick = v[3], by = v[4];
    const read = readSet.has(i.id) ? ' is-read' : '';
    const tag = i.tag != null ? i.tag : tagFromCategory(i.category);
    const kick = !noKick && (i.label || tag) ? '<div class="kick">' + (i.label ? '<span class="lbl' + (i.label === 'Live' ? ' live' : '') + '">' + esc(i.label) + '</span>' : '') +
      (tag && tag !== i.label ? '<span class="tag">' + esc(tag) + '</span>' : '') + '</div>' : '';
    const h = '<h3>' + esc(i.title) + '</h3>';
    const p = (intro && i.desc ? '<p class="intro">' + esc(i.desc) + '</p>' : '') + (by && i.author && !i.rss ? '<div class="by">' + esc(i.author) + '</div>' : '');
    const meta = i.rss ? '<div class="meta"><span class="ready-slot">' + (getCachedArticle(i.id) ? '<span class="dot-ready" title="Ready to read offline"></span>' : '') + '</span>' +
      (i.author ? '<span>' + esc(i.author) + '</span>' : '') + '<span>' + esc(timeAgo(i.date)) + '</span></div>' : '';
    let body;
    if (place === 'side' || place === 'wide') {
      const u = place === 'side' ? (i.sq ? cropUrl(i.sq, 160) : (i.image && smallImage(i.image))) : (i.l32 ? cropUrl(i.l32, 320) : (i.image && smallImage(i.image)));
      body = kick + (u ? '<div class="row"><div>' + h + '</div><img src="' + escAttr(u) + '" alt="" loading="lazy"></div>' : h) + p + meta;
    } else if (place === 'above' || place === 'below') {
      const crop = place === 'above' && !extraClass ? (i.l32 || i.l169) : (i.l169 || i.l32);
      const u = crop ? cropUrl(crop, 720) : i.image;
      const im = u ? '<img class="img-' + place + '" src="' + escAttr(u) + '" alt="" loading="lazy">' : '';
      body = place === 'above' ? im + kick + h + p + meta : kick + h + im + p + meta;
    } else body = kick + h + p + meta;
    const cls = 'c s' + size + (place === 'wide' ? ' wide' : '') + (size === 16 && place === 'none' ? ' compact' : '') + read + (extraClass ? ' ' + extraClass : '');
    return '<a class="' + cls + '" data-id="' + escAttr(i.id) + '" href="#a/' + encodeURIComponent(i.id) + '">' + body + '</a>';
  }

  // Which card each slot gets, matching how smh.com.au lays its homepage out on a phone.
  function slot(mod, pos, n) {
    switch (mod.kind) {
      // A news well: lead story big with its photo under the headline, related stories below it.
      case 'storyset': return pos === 0 ? [mod.lead ? 28 : 24, 'below', 1, 0, 1] : [20, 'side', 1, 0, 1];
      case 'column': return [16, 'none', 0, 1];
      default:
        if (/opinion/i.test(mod.heading)) return [pos < 2 ? 24 : 20, pos < 3 ? 'side' : 'none', 1];
        if (/life|culture|travel|good food/i.test(mod.heading)) return pos === 0 ? [24, 'above', 1] : [20, 'wide', 1];
        if (pos === 0) return n >= 4 ? [24, 'below', 1] : [20, 'side', 1];
        return pos < 3 ? [20, 'side', 1] : [20, 'none', 1];
    }
  }

  function renderHome() {
    const byId = new Map(items.map(i => [i.id, i]));
    listEl.innerHTML = homeModules.map((mod, mi) => {
      const stories = mod.ids.map(id => {
        const st = byId.get(id), o = mod.over && mod.over[id];
        return st && o ? Object.assign({}, st, { title: o[0], desc: o[1] }) : st;
      }).filter(Boolean);
      if (!stories.length) return '';
      const head = mod.showHeading && mod.heading ? '<div class="mh">' + esc(mod.heading) + '</div>' : (mi > 0 ? '<div class="mod-sep"></div>' : '');
      if (mod.kind === 'grid') return head + '<div class="hgrid">' + stories.map(st => card(st, [16, 'above', 0], 'g')).join('') + '</div>';
      return '<section class="mod">' + head + '<div class="mod-body">' + stories.map((st, pos) => card(st, slot(mod, pos, stories.length))).join('') + '</div></section>';
    }).join('');
  }

  function renderList() {
    const q = $('search').value.trim().toLowerCase();
    const isHome = currentTab === 'home';
    document.body.classList.toggle('on-home', isHome);
    renderBrief('auto');
    if (isHome && !q) { chipsEl.innerHTML = ''; renderHome(); return; }

    const cats = {};
    if (!isHome) items.forEach(i => { const c = topCategory(i.category); if (c) cats[c] = (cats[c] || 0) + 1; });
    const catNames = Object.keys(cats).sort((a, b) => cats[b] - cats[a]);
    if (categoryFilter && !cats[categoryFilter]) categoryFilter = null;
    chipsEl.innerHTML = catNames.length > 1 ? catNames.map(c =>
      '<button class="chip" data-cat="' + escAttr(c) + '" aria-pressed="' + (c === categoryFilter) + '">' + esc(c) + ' <span style="opacity:.6">' + cats[c] + '</span></button>'
    ).join('') : '';

    const shown = items.filter(i =>
      (!categoryFilter || topCategory(i.category) === categoryFilter) &&
      (!q || (i.title + ' ' + i.desc + ' ' + i.author + ' ' + i.category + ' ' + (i.tag || '')).toLowerCase().includes(q))
    );
    if (!shown.length) { listEl.innerHTML = '<div class="empty">No stories match.</div>'; return; }

    let lastDay = null;
    listEl.innerHTML = shown.map((i, idx) => {
      const it = isHome ? i : Object.assign({ rss: true }, i);
      if (isHome) return card(it, [20, 'side', 1]);
      const day = dayLabel(i.date);
      const header = day !== lastDay ? '<div class="day">' + esc(day) + '</div>' : '';
      lastDay = day;
      const lead = idx === 0 && !q && !categoryFilter;
      return header + card(it, lead ? [24, 'below', 1] : [20, 'side', 1]);
    }).join('');
  }

  function tagFromCategory(c) { const parts = (c || '').split('/'); return parts[parts.length - 1].trim(); }
  function topCategory(c) { return (c || '').split('/')[0].trim(); }
  // In ffx crop URLs $width_ is the width of the crop window in the original photo, not the
  // output size; the output is set by $multiply. Rescale that instead of shrinking the crop.
  function smallImage(u, w) {
    const m = /\$width_(\d+)/.exec(u || '');
    if (!m || !/\$multiply_/.test(u)) return u;
    return u.replace(/\$multiply_[\d.]+/, '$multiply_' + ((w || 320) / +m[1]).toFixed(4));
  }

  // ---------- Rendering: article ----------
  function findItem(id) {
    for (const f of FEEDS) {
      const c = f.id === currentTab ? { items } : store.get(STORE.feed(f.id), null);
      const hit = c && c.items && c.items.find(i => i.id === id);
      if (hit) return hit;
    }
    const o = store.get(STORE.opened, []).find(x => x.id === id);
    return o ? Object.assign({ desc: '', category: '' }, o) : null;
  }

  // ---------- Open any SMH link (back catalogue) ----------
  function parseAfrLink(text) {
    const m = /https?:\/\/(?:www\.|m\.|amp\.)?smh\.com\.au\/[^\s"'<>]+/i.exec(text || '');
    if (!m) return null;
    let url;
    try { const u = new URL(m[0]); u.search = ''; u.hash = ''; u.hostname = 'www.smh.com.au'; url = u.toString().replace(/\/+$/, ''); } catch (e) { return null; }

    'For opinion pieces, name the writer\'s argument and its strongest objection. For sport, lifestyle or culture stories, adapt the angles sensibly rather than forcing politics or economics in.',
    'Signal your own inference in a word or two ("likely", "the risk:") — never long disclaimers. Never invent facts, numbers or quotes. Do not repeat the headline. Australian English. No filler.',
    'Return JSON only: {"bullets":[{"lead":"…","text":"…"}]}',
  ].join('\n');

  const SIMPLE_SYSTEM = [
    'You explain Sydney Morning Herald articles to a smart reader aged about 15, or an adult who doesn\'t follow politics, economics or the news closely. Not childish, not "explain like I’m 5" — just clear.',
    'Write exactly 5 bullets. Each has a bold lead-in ("lead": 2–5 plain words that make the point) and "text": 1–2 short sentences, max 30 words in total.',
    'Cover: (1) what actually happened, in plain words; (2) why it is happening, with the background a newcomer needs; (3) who it affects and how, in everyday terms where it fits — rent and house prices, bills, jobs, schools, transport, health, the places and people readers know; (4) the other side, or what could go wrong; (5) what happens next.',
    'The first time you use any jargon (political, legal, economic or technical) or name an institution most people wouldn\'t know, explain it in a few plain words in brackets, e.g. "the Reserve Bank (which sets interest rates)". Use a quick everyday comparison where it genuinely helps. Keep the key numbers but say what they mean.',
    'Never invent facts, numbers or quotes. Australian English. Return JSON only: {"bullets":[{"lead":"…","text":"…"}]}',
  ].join('\n');
  // Which version of the summary to show: 'pro' (analyst) or 'simple' (plain English). Remembered.
  let sumMode = store.get('smh-sum-mode', 'pro') === 'simple' ? 'simple' : 'pro';
  const sumKey = (id, mode) => mode === 'simple' ? id + '|simple' : id;

  const sumInflight = new Map();
  // The summary starts folded so you can read the story first; it keeps generating in the
  // background and the header says when it's ready. Tap the header to open it.
  let sumOpen = false;
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  function paintSummary(state, stateHtml, bodyHtml) {
    const el = $('aiSum'); if (!el) return;
    el.className = 'ai sum' + (sumOpen ? ' open' : '');
    el.innerHTML = '<button type="button" class="sum-toggle ai-head" data-sumtoggle aria-expanded="' + sumOpen + '">' + SPARK +
      '<span>AI summary</span><span class="spacer"></span><span class="state' + (state === 'ready' ? ' ready' : '') + '">' + stateHtml + '</span>' + CHEV + '</button>' +
      '<div class="sum-body"><div class="sum-modes" role="group" aria-label="Summary style">' +
      '<button type="button" data-summode="pro" aria-pressed="' + (sumMode === 'pro') + '">Analyst</button>' +
      '<button type="button" data-summode="simple" aria-pressed="' + (sumMode === 'simple') + '">Plain English</button></div>' + bodyHtml + '</div>';
  }

  async function renderSummary(item, a, force) {
    if (!$('aiSum')) return;
    const id = item.id, mode = sumMode, key = sumKey(id, mode);
    const cache = store.get(STORE.sums, {});
    const hit = !force && cache[key];
    if (hit) {
      paintSummary('ready', 'Ready', bulletsHtml(hit.bullets) +
        '<div class="ai-foot">' + esc(hit.model || '') + ' · ' + esc(timeAgo(hit.at)) + ' · <button type="button" data-resum style="color:var(--accent);font-weight:600">Regenerate</button></div>');
      return;
    }
    if (!aiKey()) { paintSummary('', 'Add key', aiNoKey('a five-point summary of every article')); return; }
    if (!force && !aiPrefs().autoSum) { paintSummary('', 'Off', '<p class="ai-msg"><button type="button" data-resum>Summarise this article</button></p>'); return; }
    paintSummary('', '<span class="spin-dot"></span>Writing…', '<p class="ai-msg">Reading the article…</p>' + skeleton(5));
    try {
      let p = sumInflight.get(key);
      if (!p) {
        const user = 'Headline: ' + (a.headline || item.title) + '\nStandfirst: ' + (a.about || item.desc || '') +
          '\nBy: ' + (a.byline || item.author || '') + '\nPublished: ' + (a.published || item.date || '') +
          '\nSection: ' + [a.label, (a.categories || []).join(' / ')].filter(Boolean).join(' · ') +
          '\n\nARTICLE:\n' + articleText(a).slice(0, 24000);
        // No extended reasoning for single-article summaries: much faster, and the prompt carries the structure.
        p = openaiJSON(mode === 'simple' ? SIMPLE_SYSTEM : SUM_SYSTEM, user, 1500, 'none').finally(() => sumInflight.delete(key));
        sumInflight.set(key, p);
      }
      const out = await p;
      if (!Array.isArray(out.bullets) || !out.bullets.length) throw new Error('Unexpected response shape');
      const all = store.get(STORE.sums, {});
      all[key] = { at: Date.now(), model: aiModel(), bullets: out.bullets.slice(0, 5) };
      const keys = Object.keys(all);
      if (keys.length > 200) keys.sort((x, y) => all[x].at - all[y].at).slice(0, keys.length - 200).forEach(k => delete all[k]);
      store.set(STORE.sums, all);
      if (currentRoute() === id && sumMode === mode) renderSummary(item, a, false);
    } catch (e) {
      if (currentRoute() !== id || sumMode !== mode) return;
      paintSummary('', 'Failed', '<p class="ai-msg">Couldn’t summarise: ' + esc(e.message) + ' <button type="button" data-resum>Try again</button></p>');
    }
  }

  // --- Tab briefing: a coffee-length read on everything in the tab ---
  function briefSystem(tabName) {
    return [
      'You are the editor of a premium morning briefing read over coffee by a busy, well-informed Sydneysider before their day starts.',
      'You are given the current stories from The Sydney Morning Herald' + (tabName === 'Home' ? ' front page (in the editors’ running order)' : ' "' + tabName + '" section') + ', some with article excerpts.',
      'It must be skimmable in under a minute. Write: "take" — ONE sentence (max 25 words) on the day’s dominant theme; then "bullets" — exactly 5 items ordered by how much they matter to a Sydney reader (not list order) — lead with the news that changes things, not the lightest or most-clicked.',
      'Each bullet has a bold lead-in ("lead": 2–5 words that state the point) and "text": ONE sentence, max 28 words, that synthesises rather than lists — the key specific (a figure or name) plus why it matters or the angle others miss (who wins/loses, the tension, the risk). Signal your own inference in a word ("likely", "risk:"), never with long disclaimers. Never invent facts.',
      'Each bullet also has "ids": the 1–3 story ids it draws on, copied exactly from the list.',
      'Finish with "watch": what to watch today or this week, max 15 words.',
      'Australian English. No filler, no "In today’s news". Return JSON only: {"take":"…","bullets":[{"lead":"…","text":"…","ids":["…"]}],"watch":"…"}',
    ].join('\n');
  }
  function briefSignature(list) { return list.slice(0, 20).map(i => i.id).join(','); }
  const briefInflight = new Map();

  // mode: 'auto' when the list is drawn, 'force' from the Refresh button, 'show' after a new one lands.
  function renderBrief(mode) {
    mode = mode || 'auto';
    const el = $('brief');
    const tab = currentTab, feed = FEEDS.find(f => f.id === tab);
    if (!items.length || $('search').value.trim()) { el.innerHTML = ''; return; }
    const title = tab === 'home' ? 'Morning briefing' : feed.name + ' briefing';
    const collapsed = store.get('smh-brief-collapsed', false);
    const head = '<div class="ai-head">' + SPARK + '<span>' + esc(title) + '</span><span class="spacer"></span>';
    const cached = mode === 'force' ? null : store.get(STORE.brief(tab), null);
    const sig = briefSignature(items);
    const fresh = cached && (Date.now() - cached.at < 6 * 3600e3) && (cached.sig === sig || Date.now() - cached.at < 90 * 60e3);
    const canAuto = aiKey() && aiPrefs().autoBrief;
    if (cached) {
      const busy = briefInflight.has(tab);
      el.innerHTML = '<section class="ai' + (collapsed ? ' collapsed' : '') + '">' + head +
        '<button type="button" data-rebrief>' + (busy ? 'Updating…' : 'Refresh') + '</button><button type="button" data-collapse>' + (collapsed ? 'Show' : 'Hide') + '</button></div>' +
        (cached.data.take ? '<p class="ai-take">' + esc(cached.data.take) + '</p>' : '') +
        bulletsHtml(cached.data.bullets, true) +
        (cached.data.watch ? '<p class="ai-watch"><b>Watch:</b> ' + esc(cached.data.watch) + '</p>' : '') +
        '<div class="ai-foot">' + esc(cached.model || '') + ' · written ' + esc(timeAgo(cached.at)) + (cached.sig !== sig && !busy ? ' · new stories since' : '') + '</div></section>';
      if (mode === 'auto' && !fresh && canAuto) generateBrief(tab, feed);
      return;
    }
    if (!aiKey()) { el.innerHTML = '<section class="ai">' + head + '</div>' + aiNoKey('a morning briefing across these stories') + '</section>'; return; }
    if (mode === 'auto' && !canAuto) {
      el.innerHTML = '<section class="ai">' + head + '</div><p class="ai-msg"><button type="button" data-rebrief>Write the briefing</button></p></section>';
      return;
    }
    el.innerHTML = '<section class="ai">' + head + '</div><p class="ai-msg">Reading today’s stories…</p>' + skeleton(6) + '</section>';
    generateBrief(tab, feed);
  }

  async function generateBrief(tab, feed) {
    if (briefInflight.has(tab)) return;
    briefInflight.set(tab, true);
    // Give the top stories a moment to download so the briefing can use their full text.
    await Promise.race([prefetchTop(), new Promise(r => setTimeout(r, 20000))]);
    if (currentTab !== tab) { briefInflight.delete(tab); return; }
    const list = items.slice(0, 40), sig = briefSignature(items);
    const lines = list.map((i, n) => {
      const a = getCachedArticle(i.id);
      let line = '[' + i.id + '] ' + (i.label ? i.label + ' · ' : '') + (i.tag || tagFromCategory(i.category) || '') + ' — ' + i.title + (i.desc ? ' — ' + i.desc : '');
      if (a && n < 14) line += '\n   Excerpt: ' + articleText(a).slice(0, 1400).replace(/\s+/g, ' ');
      return line;
    }).join('\n');
    const today = new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Australia/Sydney' });
    try {
      const out = await openaiJSON(briefSystem(feed.name), 'Today is ' + today + '.\n\nSTORIES:\n' + lines, 4000);
      if (!Array.isArray(out.bullets) || !out.bullets.length) throw new Error('Unexpected response shape');
      store.set(STORE.brief(tab), { at: Date.now(), sig, model: aiModel(), data: out });
      briefInflight.delete(tab);
      if (currentTab === tab && !currentRoute()) renderBrief('show');
    } catch (e) {
      if (currentTab === tab && !currentRoute()) {
        const el = $('brief');
        const box = el.querySelector('.ai') || el;
        const msg = document.createElement('p'); msg.className = 'ai-msg';
        msg.innerHTML = 'Couldn’t write the briefing: ' + esc(e.message) + ' <button type="button" data-rebrief>Try again</button>';
        box.querySelectorAll('.skl').forEach(n => n.remove());
        const old = box.querySelector('.ai-msg'); if (old && !box.querySelector('ul')) old.remove();
        box.appendChild(msg);
      }
    } finally { briefInflight.delete(tab); }
  }

  // --- Settings ---
  function openSettings() {
    const k = store.get(STORE.key, '');
    $('keyInput').value = k || '';
    let benKey = '', afrKey = store.get('afr-openai-key', ''); try { benKey = localStorage.getItem('ben-chat-openai-key') || ''; } catch (e) {}
    $('keyInput').placeholder = !k && afrKey ? 'Using the key saved for AFR Reader' : !k && benKey ? 'Using the key saved for Ask Ben' : 'sk-…';
    $('modelInput').value = store.get(STORE.model, '') || '';
    $('modelInput').placeholder = DEFAULT_MODEL;
    const pr = aiPrefs();
    $('autoBrief').checked = pr.autoBrief; $('autoSum').checked = pr.autoSum;
    $('darkMode').checked = isDark();
    try { $('settings').showModal(); } catch (e) { $('settings').setAttribute('open', ''); }
  }
  $('settingsBtn').addEventListener('click', openSettings);
  document.addEventListener('click', e => {
    if (e.target.closest('[data-open-settings]')) { e.preventDefault(); openSettings(); }
    else if (e.target.closest('[data-rebrief]')) { e.preventDefault(); if (!briefInflight.has(currentTab)) { store.set(STORE.brief(currentTab), null); renderBrief('force'); } }
    else if (e.target.closest('[data-collapse]')) { e.preventDefault(); store.set('smh-brief-collapsed', !store.get('smh-brief-collapsed', false)); renderBrief('show'); }
    else if (e.target.closest('[data-sumtoggle]')) {
      e.preventDefault();
      sumOpen = !sumOpen;
      const el = $('aiSum'); el.classList.toggle('open', sumOpen);
      el.querySelector('[data-sumtoggle]').setAttribute('aria-expanded', sumOpen);
    }
    else if (e.target.closest('[data-summode]')) {
      e.preventDefault();
      const m = e.target.closest('[data-summode]').dataset.summode;
      if (m !== sumMode) {
        sumMode = m; store.set('smh-sum-mode', m); sumOpen = true;
        const id = currentRoute(), a = id && getCachedArticle(id);
        if (a) renderSummary(findItem(id) || { id, title: a.headline, desc: a.about }, a, false);
      }
    }
    else if (e.target.closest('[data-resum]')) {
      e.preventDefault();
      const id = currentRoute(), a = id && getCachedArticle(id);
      if (a) { sumOpen = true; renderSummary(findItem(id) || { id, title: a.headline, desc: a.about }, a, true); }
    }
  });
  $('settingsForm').addEventListener('submit', () => {
    const k = $('keyInput').value.trim();
    if (k) store.set(STORE.key, k);
    const m = $('modelInput').value.trim();
    store.set(STORE.model, m || '');
    store.set(STORE.aiPrefs, { autoBrief: $('autoBrief').checked, autoSum: $('autoSum').checked });
    const dark = $('darkMode').checked;
    if (dark !== isDark()) { applyTheme(dark ? 'dark' : 'light'); store.set(STORE.theme, dark ? 'dark' : 'light'); }
    toast(k ? 'Saved — key stored on this device' : 'Saved');
    if (currentRoute()) { const id = currentRoute(), a = getCachedArticle(id); if (a) renderSummary(findItem(id) || { id }, a, false); }
    else renderBrief('auto');
  });
  $('forgetKey').addEventListener('click', () => {
    try { localStorage.removeItem(STORE.key); } catch (e) {}
    $('keyInput').value = ''; toast('Key removed from this device');
  });
  $('clearAi').addEventListener('click', () => {
    try { Object.keys(localStorage).filter(k => k.indexOf('smh-ai-summaries') === 0 || k.indexOf('smh-ai-brief') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    toast('Saved summaries cleared');
  });

  function renderRecent() {
    const list = store.get(STORE.opened, []).filter(x => x.title).slice(0, 12);
    $('recentLinks').innerHTML = list.length ? '<div class="recent"><h3>Recently opened</h3>' + list.map(x =>
      '<a href="#a/' + encodeURIComponent(x.id) + '" data-close-link><b>' + esc(x.title) + '</b><span>' + esc([x.tag, x.date ? fmtDate(x.date) : ''].filter(Boolean).join(' · ')) + '</span></a>'
    ).join('') + '</div>' : '';
  }
  function openLinkDialog() {
    $('linkInput').value = ''; $('linkErr').hidden = true; renderRecent();
    try { $('linkDlg').showModal(); } catch (e) { $('linkDlg').setAttribute('open', ''); }
    setTimeout(() => $('linkInput').focus(), 50);
  }
  $('linkBtn').addEventListener('click', openLinkDialog);
  $('linkCancel').addEventListener('click', () => $('linkDlg').close());
  $('linkForm').addEventListener('submit', e => {
    if (!openLink($('linkInput').value)) {
      e.preventDefault();
      $('linkErr').textContent = 'That doesn’t look like an smh.com.au article link.'; $('linkErr').hidden = false;
    }
  });
  $('pasteBtn').addEventListener('click', async () => {
    try { const t = await navigator.clipboard.readText(); $('linkInput').value = t.trim(); if (parseAfrLink(t)) { $('linkDlg').close(); openLink(t); } }
    catch (e) { $('linkErr').textContent = 'Couldn’t read the clipboard — long-press the box and choose Paste.'; $('linkErr').hidden = false; }
  });
  $('recentLinks').addEventListener('click', e => { if (e.target.closest('[data-close-link]')) $('linkDlg').close(); });
  // Pasting an SMH link into the filter box opens it too.
  $('search').addEventListener('input', e => {
    if (/smh\.com\.au\//i.test(e.target.value) && openLink(e.target.value)) { e.target.value = ''; }
  });

  // ---------- Events ----------
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    if (b.dataset.tab === currentTab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    feedScrolls[b.dataset.tab] = 0;
    location.hash = 't/' + b.dataset.tab;
  });
  chipsEl.addEventListener('click', e => {
    const c = e.target.closest('[data-cat]'); if (!c) return;
    categoryFilter = categoryFilter === c.dataset.cat ? null : c.dataset.cat;
    renderList();
  });
  $('search').addEventListener('input', renderList);
  $('refreshBtn').addEventListener('click', () => {
    const id = currentRoute();
    if (id) {
      memArticles.delete(id);
      const all = store.get(STORE.articles, {}); delete all[id]; store.set(STORE.articles, all);
      openArticle(id);
    } else loadFeed(true);
  });
  // Go back through history when we arrived from the feed, so its scroll position survives.
  $('backBtn').addEventListener('click', () => { if (cameFromFeed) history.back(); else location.hash = 't/' + currentTab; });
  // The masthead always takes you to the front page, like smh.com.au.
  $('brand').addEventListener('click', e => {
    e.preventDefault();
    if (currentTab === 'home' && !currentRoute()) window.scrollTo({ top: 0, behavior: 'smooth' });
    else { feedScrolls.home = 0; location.hash = 't/home'; }
  });
  let size = store.get(STORE.size, 20);
  applySize(size);
  $('sizeUp').addEventListener('click', () => { size = applySize(size + 1); });
  $('sizeDown').addEventListener('click', () => { size = applySize(size - 1); });
  applyTheme(store.get(STORE.theme, null));
  function isDark() { return getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#121417'; }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && currentRoute() && !$('settings').open) $('backBtn').click();
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && currentRoute() && !$('settings').open) {
      const n = neighbour(currentRoute(), e.key === 'ArrowRight' ? 1 : -1);
      if (n) goArticle(n.id, e.key === 'ArrowRight' ? 1 : -1);
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !currentRoute()) loadFeed(false);
  });

  // ---------- Boot ----------
  let booted = false;
  renderTabs();
  const deep = new URLSearchParams(location.search).get('url') || (/^#u\/(.+)$/.exec(location.hash) || [])[1];
  const deepHit = deep && parseAfrLink(decodeURIComponent(deep));
  if (deepHit) {
    rememberOpened(deepHit);
    history.replaceState(null, '', location.pathname + '#t/home');
    history.pushState(null, '', '#a/' + encodeURIComponent(deepHit.id));
  } else if (!currentRoute() && !tabFromHash()) history.replaceState(null, '', '#t/home');
  loadFeed(false);
  route();
  booted = true;
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
