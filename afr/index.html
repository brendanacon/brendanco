<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AFR Reader</title>
<meta name="description" content="A clean reader for the Australian Financial Review feed.">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AFR">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --ink: #0a0a0a;
  --ink-2: #5a5a5a;
  --ink-3: #767676;
  --rule: #dcdcdc;
  --accent: #0e67c7;
  --accent-soft: #e8f0fb;
  --read: #8a8a8a;
  --shadow: 0 1px 2px rgba(20, 24, 32, .06), 0 4px 16px rgba(20, 24, 32, .05);
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --reader-size: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417;
    --surface: #1a1d22;
    --ink: #ebe8e1;
    --ink-2: #b7b9be;
    --ink-3: #868a93;
    --rule: #2a2e35;
    --accent: #6aa7ff;
    --accent-soft: #1d2638;
    --read: #6b6f78;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #121417;
  --surface: #1a1d22;
  --ink: #ebe8e1;
  --ink-2: #b7b9be;
  --ink-3: #868a93;
  --rule: #2a2e35;
  --accent: #6aa7ff;
  --accent-soft: #1d2638;
  --read: #6b6f78;
  --shadow: none;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

/* --- Top bar --- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--rule);
  padding-top: env(safe-area-inset-top);
}
.topbar-row { display: flex; align-items: center; gap: 8px; height: 56px; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; min-width: 0; }
.masthead { height: 19px; width: auto; display: block; color: var(--accent); }
.brand-sub { font-size: 12px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-2);
}
.icon-btn:hover { background: var(--accent-soft); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  padding: 0 16px; margin: 0 -16px; border-top: 1px solid var(--rule);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; padding: 12px 10px 10px; font-size: 14px; font-weight: 600; color: var(--ink-2);
  border-bottom: 3px solid transparent;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* --- Feed --- */
.feed-head { display: flex; align-items: center; gap: 10px; padding: 14px 0 6px; }
.search {
  flex: 1; min-width: 0; height: 40px; border-radius: 4px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  padding: 0 12px; font: inherit; font-size: 15px;
}
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.status { font-size: 13px; color: var(--ink-3); padding: 4px 0 10px; min-height: 24px; }
.status.err { color: #c0392b; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 12px; }
.chip {
  font-size: 12px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--rule); color: var(--ink-2); background: var(--surface);
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.meta { font-size: 13px; color: var(--ink-3); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-family: var(--sans); }
.kicker { font-size: 14px; font-weight: 500; color: var(--accent); margin-bottom: 8px; }
.ready-slot:empty { display: none; }
.dot-ready { width: 6px; height: 6px; border-radius: 50%; background: #2e9d6a; display: inline-block; }

/* Story cards, modelled on afr.com's mobile homepage */
.c { display: block; padding: 20px 0; border-top: 1px solid var(--rule); text-decoration: none; cursor: pointer; }
.mod-body > .c:first-child, .mod-first > .c:first-child, #list > .c:first-child { border-top: 0; }
.kick { font-size: 14px; line-height: 1.3; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 0 10px; }
.kick .lbl { font-weight: 700; color: var(--ink); }
.kick .tag { font-weight: 500; color: var(--accent); }
.c h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; line-height: 1.16; color: var(--ink); text-wrap: pretty; }
.s28 h3 { font-size: 28px; line-height: 1.12; }
.s24 h3 { font-size: 24px; }
.s20 h3 { font-size: 20px; line-height: 1.2; }
.s16 h3 { font-size: 16px; line-height: 1.28; }
.c .intro { font-family: var(--serif); font-size: 17px; line-height: 1.42; color: var(--ink-2); margin-top: 10px; }
.c img { display: block; object-fit: cover; background: var(--rule); }
.c .row { display: grid; grid-template-columns: 1fr 80px; gap: 16px; align-items: start; }
.c .row img { width: 80px; height: 80px; }
.c.wide .row { grid-template-columns: 1fr 160px; }
.c.wide .row img { width: 160px; height: 107px; }
.c .img-above { width: 100%; aspect-ratio: 3 / 2; margin-bottom: 14px; }
.c .img-below { width: 100%; aspect-ratio: 16 / 9; margin-top: 14px; }
.c.compact { padding: 14px 0; }
.is-read h3 { color: var(--read); }
.c:hover h3 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }

/* Homepage modules */
.mod { margin-top: 8px; }

/* AI briefing + article summary */
.ai { border: 1px solid var(--rule); border-top: 4px solid var(--accent); padding: 16px 16px 14px; margin: 14px 0 6px; background: var(--surface); }
.ai-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.ai-head svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.ai-head .spacer { flex: 1; }
.ai-head button { font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--accent); padding: 4px 2px; }
.ai-take { font-family: var(--serif); font-size: 19px; line-height: 1.38; font-weight: 600; margin: 12px 0 2px; }
.ai ul { list-style: none; margin: 10px 0 0; padding: 0; }
.ai li { position: relative; padding: 0 0 0 16px; margin: 0 0 12px; font-family: var(--serif); font-size: 17px; line-height: 1.45; color: var(--ink); }
.ai li::before { content: ''; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; background: var(--accent); }
.ai li b { font-weight: 700; }
.ai .refs { display: block; margin-top: 4px; font-family: var(--sans); font-size: 13px; line-height: 1.4; }
.ai .refs a { color: var(--accent); text-decoration: none; }
.ai .refs a + a::before { content: ' · '; color: var(--ink-3); }
.ai-watch { font-size: 14px; line-height: 1.45; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 4px; }
.ai-watch b { color: var(--ink); }
.ai-foot { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.ai-msg { font-size: 15px; line-height: 1.45; color: var(--ink-2); margin-top: 10px; }
.ai-msg button { color: var(--accent); font-weight: 600; }
.ai .skl { height: 14px; background: var(--rule); margin: 12px 0; animation: pulse 1.2s ease-in-out infinite; }
.ai .skl:nth-child(odd) { width: 86%; }
@keyframes pulse { 50% { opacity: .45; } }
.ai.collapsed ul, .ai.collapsed .ai-take, .ai.collapsed .ai-watch, .ai.collapsed .ai-foot { display: none; }
.story .ai { margin: 18px 0 24px; }
.sum-toggle { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; color: inherit; }
.sum-toggle .state { font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.sum-toggle .state.ready { color: var(--accent); }
.sum-toggle .chev { width: 18px; height: 18px; color: var(--ink-2); transition: transform .2s; }
.ai.sum.open .chev { transform: rotate(180deg); }
.ai.sum:not(.open) .sum-body { display: none; }
.ai.sum:not(.open) { padding-bottom: 16px; }
.spin-dot { width: 10px; height: 10px; border: 2px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: -1px; margin-right: 4px; }
/* swipe between stories */
#reader { touch-action: pan-y; }
#reader.slide-l { animation: slideL .22s ease-out; }
#reader.slide-r { animation: slideR .22s ease-out; }
@keyframes slideL { from { transform: translateX(40px); opacity: .3; } }
@keyframes slideR { from { transform: translateX(-40px); opacity: .3; } }
.swipe-hint { font-size: 12px; color: var(--ink-3); text-align: center; margin-top: 18px; }

/* Settings sheet */
dialog#settings { border: 0; padding: 0; margin: auto; width: min(460px, calc(100% - 24px)); background: var(--bg); color: var(--ink); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog#settings::backdrop { background: rgba(0,0,0,.45); }
.sheet { padding: 20px; display: grid; gap: 12px; }
.sheet h2 { font-family: var(--serif); font-size: 22px; }
.fld { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fld input { height: 42px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 12px; font: inherit; font-size: 16px; font-weight: 400; background: var(--surface); color: var(--ink); }
.chk { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.hint { font-size: 13px; line-height: 1.45; color: var(--ink-3); margin-top: -4px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.row-btns .spacer { flex: 1; }
body.on-home .feed-head { display: none; }
body.on-home .status { padding-top: 12px; }
.mh { border-top: 6px solid var(--ink); margin-top: 32px; padding: 14px 0 2px; font-size: 17px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.mod-sep { border-top: 1px solid var(--rule); }
.hgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 16px; padding: 22px 0; border-top: 1px solid var(--rule); }
.hgrid .c { border: 0; padding: 0; }
.hgrid .img-above { aspect-ratio: 16 / 9; margin-bottom: 12px; }

/* Day dividers in the chronological tabs */
.day { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink);
  padding: 14px 0 2px; margin-top: 28px; border-top: 6px solid var(--ink); }
.day + .c { border-top: 0; }
#list > .day:first-child { margin-top: 4px; }
.empty { padding: 60px 0; text-align: center; color: var(--ink-3); font-size: 15px; }
.skel { height: 110px; border-top: 1px solid var(--rule); position: relative; overflow: hidden; }
.skel::after { content: ''; position: absolute; inset: 18px 130px 18px 0; border-radius: 6px;
  background: linear-gradient(90deg, var(--rule), color-mix(in srgb, var(--rule) 40%, transparent), var(--rule));
  background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }

/* --- Reader --- */
#reader { display: none; }
body.reading #reader { display: block; }
body.reading #feed { display: none; }
body.reading .tabs { display: none; }

.progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0; z-index: 30; transition: width .1s linear; }
article.story { padding: 28px 0 80px; }
.story .kicker { margin-bottom: 12px; }
.story h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 6vw, 42px); line-height: 1.1; letter-spacing: -0.015em; text-wrap: balance; }
.story .standfirst { font-family: var(--serif); font-size: 21px; line-height: 1.4; color: var(--ink-2); margin-top: 14px; }
.byline { display: flex; align-items: center; gap: 12px; margin: 22px 0; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.byline img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--rule); }
.byline .who { font-size: 14px; font-weight: 600; }
.byline .when { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.story figure { margin: 26px 0; }
.story figure img { width: 100%; height: auto; aspect-ratio: var(--ar, 3 / 2); object-fit: cover; border-radius: 0; display: block; background: var(--rule); }
.story figcaption { font-size: 13px; line-height: 1.45; color: var(--ink-3); margin-top: 8px; }
.story figcaption .credit { opacity: .8; }
.story .hero { margin: 0 0 8px; }

.body { font-family: var(--serif); font-size: var(--reader-size); line-height: 1.62; color: var(--ink); }
.body p { margin: 0 0 1.05em; }
.body h2 { font-family: var(--sans); font-size: .9em; font-weight: 700; letter-spacing: -0.005em; margin: 1.8em 0 .6em; }
.body a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.body blockquote { border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; margin: 1.6em 0; font-size: 1.12em; font-weight: 600; color: var(--ink); }
.body blockquote p { margin: 0; }
.body .embed { margin: 1.6em 0; border-radius: 10px; overflow: hidden; background: var(--surface); border: 1px solid var(--rule); }
.body .embed iframe { width: 100%; height: 480px; border: 0; display: block; background: #fff; }

.story-foot { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface);
  text-decoration: none; color: var(--ink-2);
}
.pill:hover { color: var(--ink); border-color: var(--ink-3); }
.pill.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.nextup { margin-top: 36px; }
.nextup .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }

.fail { padding: 40px 0; }
.fail h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; margin-bottom: 10px; }
.fail p { color: var(--ink-2); line-height: 1.5; margin-bottom: 18px; font-size: 15px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); font-size: 14px; padding: 10px 16px; border-radius: 10px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 520px) {
  .brand-sub { display: none; }
  .story .standfirst { font-size: 19px; }
  .body .embed iframe { height: 380px; }
}
</style>
</head>

4.6 1.7V.6H88v1.1h2.5v22L81.7.6h-7.8v1.1h2.8v31h-2.9v1.1h7.1v-1.1h-2.8V6.5l10.4 27.4H92v-32h2.8l-.2-.2zM64.9.7h-5.1l-5.5 32h-2.8v1H59v-1.1h-3.2l1.7-10.3h5.9l2.1 10.3h-3v1.1h10.3v-1.1h-1.5c.1.1-6.4-31.9-6.4-31.9zm-7.3 20.4L60 6.4l3.1 14.7h-5.5zM52.9 1.7V.6h-6.8v1.1h2.8v22.8L39.9.7H32v1.1h2.8v31h-2.9v1h7.4v-1.1h-3V7.1l9.8 26.8h4.2v-32H53c-.1-.1-.1-.2-.1-.2zm-25.3 0h2.9V.6H19v1.1h3.2v31h-3.7v1.1h12.2v-1.1h-3.1v-31zM0 1.7h4.2v31H0v1.1h13.1v-1.1H9.6V16.6h2.9c1.5 0 1.8 2.8 1.7 4.3h1.1V10.7h-1.1c.1 1.7-.3 4.9-1.7 4.9H9.7v-14c1.8.1 4.6.2 5.9 1.6 1.7 1.7 1.6 4.2 1.8 6.5h.8v-9H0v1z"></path></svg></a>
