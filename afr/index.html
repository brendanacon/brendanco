<script>
(function() {
  'use strict';

  // ---------- Config ----------
  const FEEDS = [
    { id: 'home',       name: 'Home',       url: 'https://www.afr.com/', home: true },
    { id: 'latest',     name: 'Latest',     url: 'https://www.afr.com/rss/feed.xml' },
    { id: 'street-talk', name: 'Street Talk', url: 'https://www.afr.com/street-talk', tagPage: true },
    { id: 'chanticleer', name: 'Chanticleer', url: 'https://www.afr.com/chanticleer', tagPage: true },
    { id: 'rear-window', name: 'Rear Window', url: 'https://www.afr.com/rear-window', tagPage: true },
    { id: 'afr-view',    name: 'AFR View',    url: 'https://www.afr.com/the-afr-view', tagPage: true, tagName: 'The AFR View' },
    { id: 'markets',    name: 'Markets',    url: 'https://www.afr.com/rss/markets.xml' },
    { id: 'politics',   name: 'Politics',   url: 'https://www.afr.com/rss/politics.xml' },
    { id: 'policy',     name: 'Policy',     url: 'https://www.afr.com/rss/policy.xml' },
    { id: 'property',   name: 'Property',   url: 'https://www.afr.com/rss/property.xml' },
    { id: 'technology', name: 'Technology', url: 'https://www.afr.com/rss/technology.xml' },
    { id: 'wealth',     name: 'Wealth',     url: 'https://www.afr.com/rss/wealth.xml' },
    { id: 'world',      name: 'World',      url: 'https://www.afr.com/rss/world.xml' },
  ];
  const PROXIES = [
    { name: 'cf-worker', url: u => 'https://rss-proxy.brendanaconnaughton.workers.dev/?url=' + encodeURIComponent(u) },
    { name: 'corsproxy', url: u => 'https://corsproxy.io/?' + encodeURIComponent(u) },
    { name: 'allorigins', url: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
  ];
  const TIMEOUT_MS = 15000;
  const PREFETCH_COUNT = 12;       // warm the cache for the top N stories in the current tab
  const PREFETCH_CONCURRENCY = 3;
  const MAX_CACHED_ARTICLES = 100;
  const ARCHIVE_MAX = 250;         // stories kept per tab
  const ARCHIVE_DAYS = 14;
  const STORE = {
    feed: id => 'afr-feed-' + id,
    articles: 'afr-articles',
    read: 'afr-read',
    tab: 'afr-tab-v2',
    size: 'afr-size',
    theme: 'afr-theme',
    key: 'afr-openai-key',
    model: 'afr-openai-model',
    aiPrefs: 'afr-ai-prefs',
    sums: 'afr-ai-summaries-v2',
    brief: id => 'afr-ai-brief2-' + id,
  };
  const DEFAULT_MODEL = 'gpt-5.5';
  const img = (id, w) => 'https://static.ffx.io/images/$width_' + (w || 800) + '/t_resize_width/q_86%2Cf_auto/' + id;

  // ---------- Storage helpers (never throw) ----------
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  };

  // ---------- State ----------
  let currentTab = tabFromHash() || 'home';
  let homeModules = [];           // homepage layout: [{ heading, kind, showHeading, ids }]
  let items = [];                 // items in the current tab
  let categoryFilter = null;
  const memArticles = new Map();  // id -> parsed article (session)
  const inflight = new Map();     // id -> promise
  let readSet = new Set(store.get(STORE.read, []));
  let workingProxy = 0;

  const $ = id => document.getElementById(id);
  const listEl = $('list'), statusEl = $('status'), chipsEl = $('chips'), readerEl = $('reader');

  // ---------- Networking ----------
  async function fetchWithTimeout(url) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.text();
    } catch (e) {
      throw new Error(e.name === 'AbortError' ? 'timed out' : e.message);
    } finally { clearTimeout(t); }
  }

  // Try the last proxy that worked first, then the rest.
  async function fetchText(url, validate) {
    const order = PROXIES.map((_, i) => (workingProxy + i) % PROXIES.length);
    const errors = [];
    for (const i of order) {
      try {
        const text = await fetchWithTimeout(PROXIES[i].url(url));
        if (validate && !validate(text)) throw new Error('unexpected response');
        workingProxy = i;
        return text;
      } catch (e) { errors.push(PROXIES[i].name + ': ' + e.message); }
    }
    throw new Error(errors.join(' · '));
  }

  function cleanLink(link) {
    try { const u = new URL(link); u.search = ''; u.hash = ''; return u.toString(); } catch (e) { return link; }
  }
  function idFromLink(link) {
    const m = /-(p[0-9a-z]{5,6})(?:[/?#]|$)/i.exec(link);
    return m ? m[1] : null;
  }

  // ---------- Feed ----------
  function parseFeed(xml) {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    return Array.from(doc.querySelectorAll('item')).map(it => {
      const txt = sel => { const n = it.getElementsByTagName(sel)[0]; return n ? n.textContent.trim() : ''; };
      const link = cleanLink(txt('link'));
      const enc = it.getElementsByTagName('enclosure')[0];
      return {
        id: idFromLink(link) || txt('guid') || link,
        link,
        title: txt('title'),
        desc: txt('description'),
        category: txt('category'),
        author: txt('dc:creator') || txt('creator'),
        image: enc ? enc.getAttribute('url') : '',
        date: txt('pubDate'),
      };
    }).filter(i => i.title && i.link);
  }

  // AFR's feeds only carry their newest 20 items and can't be paged, so each tab keeps
  // an on-device archive: every refresh merges into it instead of replacing it.
  function mergeItems(oldItems, fresh) {
    const byId = new Map();
    (oldItems || []).forEach(i => byId.set(i.id, i));
    fresh.forEach(i => byId.set(i.id, i));
    const cutoff = Date.now() - ARCHIVE_DAYS * 864e5;
    return Array.from(byId.values())
      .map(i => ({ i, t: (parseDate(i.date) || new Date(0)).getTime() }))
      .filter(x => x.t >= cutoff)
      .sort((a, b) => b.t - a.t)
      .slice(0, ARCHIVE_MAX)
      .map(x => x.i);
  }

  function saveArchive(id, list, extra) {
    const entry = Object.assign({ at: Date.now(), items: list }, extra || {});
    if (!store.set(STORE.feed(id), entry)) {
      // Storage full: give the space back from the article cache first, then retry smaller.
      store.set(STORE.articles, {});
      entry.items = list.slice(0, Math.floor(ARCHIVE_MAX / 2));
      store.set(STORE.feed(id), entry);
    }
  }

  // Column pages (Street Talk, Chanticleer…) embed their latest 20 stories in the
  // same hydration JSON as article pages.
  function parseTagPage(html, feed) {
    const marker = 'window.__staticRouterHydrationData = JSON.parse(';
    const start = html.indexOf(marker);
    if (start === -1) throw new Error(feed.name + ' page data not found');
    const s0 = start + marker.length;
    const data = JSON.parse(JSON.parse(html.slice(s0, html.indexOf(');<\/script>', s0))));
    const find = (o, d) => {
      if (!o || typeof o !== 'object' || d > 8) return null;
      if (o.assetsConnection && Array.isArray(o.assetsConnection.assets)) return o.assetsConnection.assets;
      for (const k in o) { const r = find(o[k], d + 1); if (r) return r; }
      return null;
    };
    const assets = find(data, 0) || [];
    return assets.filter(a => STORY_TYPES.has(a.assetType)).map(a => {
      const st = homeStory(a);
      // Every story here carries the column's own tag, so show its topic tag instead, as afr.com does.
      const tags = a.tags || {};
      if (tags.primary && tags.primary.displayName === (feed.tagName || feed.name)) {
        const topic = (tags.secondary || []).find(t => t.context === 'Topic');
        st.tag = topic ? topic.displayName : '';
      }
      return st;
    }).filter(st => st.title);
  }

  async function fetchFeedItems(feed) {
    if (feed.tagPage) {
      const list = parseTagPage(await fetchText(feed.url, t => t.indexOf('assetsConnection') !== -1), feed);
      if (!list.length) throw new Error(feed.name + ' had no stories');
      return list;
    }
    const xml = await fetchText(feed.url, t => /<item[\s>]/.test(t));
    const list = parseFeed(xml);
    if (!list.length) throw new Error(feed.name + ' feed was empty');
    return list;
  }

  const STORY_TYPES = new Set(['article', 'featureArticle', 'liveArticle']);

  // ---------- Homepage ----------
  // afr.com ships its whole homepage layout in window.__REDUX_STATE__ (a JS literal, not
  // strict JSON). Pull out just the contentUnitGroups array by bracket-matching, then
  // patch the few JS-only tokens it can contain.
  function sliceJson(text, from) {
    const open = text[from], close = open === '[' ? ']' : '}';
    let depth = 0, inStr = false;
    for (let i = from; i < text.length; i++) {
      const ch = text[i];
      if (inStr) { if (ch === '\\') i++; else if (ch === '"') inStr = false; continue; }
      if (ch === '"') inStr = true;
      else if (ch === open) depth++;
      else if (ch === close && --depth === 0) return text.slice(from, i + 1);
    }
    return null;
  }

  function cropOf(fi, key) {
    const d = fi && fi[key] && fi[key].data;
    return d && d.id ? [d.id, +(+d.zoom || 1).toFixed(6), d.cropWidth || 0, d.offsetX || 0, d.offsetY || 0, d.aspect || 1] : null;
  }
  function cropUrl(c, w) {
    if (!c) return '';
    if (!c[2]) return img(c[0], w);
    return 'https://static.ffx.io/images/$zoom_' + c[1] + '%2C$multiply_' + (w / c[2]).toFixed(4) + '%2C$ratio_' + c[5] +
      '%2C$width_' + c[2] + '%2C$x_' + c[3] + '%2C$y_' + c[4] + '/t_crop_custom/q_86%2Cf_auto/' + c[0];
  }

  
  function homeStory(a) {
    const fi = a.featuredImages || {};
    const path = a.urls && ((a.urls.canonical && a.urls.canonical.path) || (a.urls.published && a.urls.published.afr && a.urls.published.afr.path));
    const tag = a.tags && a.tags.primary ? a.tags.primary.displayName : ((a.category && a.category.name) || '');
    const authors = ((a.participants && a.participants.authors) || []).map(x => x.name).filter(Boolean);
    const sq = cropOf(fi, 'square1x1'), l32 = cropOf(fi, 'landscape3x2'), l169 = cropOf(fi, 'landscape16x9');
    const id = a.shortId || a.id;
    return {
      id,
      link: path ? 'https://www.afr.com' + path : 'https://www.afr.com/link/follow-20180101-' + id,
      title: (a.asset && a.asset.headlines && a.asset.headlines.headline) || (a.headlines && a.headlines.headline) || '',
      desc: (a.asset && a.asset.about) || a.about || '',
      tag, label: a.label || '',
      category: tag,
      author: (a.asset && a.asset.byline) || authors.join(', '),
      date: (a.dates && (a.dates.published || a.dates.firstPublished)) || '',
      sq, l32, l169,
      image: cropUrl(l169 || l32 || sq, 640),
    };
  }

  function parseHome(html) {
    const m = /"contentUnitGroups"\s*:\s*\[/.exec(html);
    if (!m) throw new Error('homepage layout not found');
    const raw = sliceJson(html, m.index + m[0].length - 1);
    if (!raw) throw new Error('homepage layout was cut off');
    const groups = JSON.parse(raw.replace(/:undefined(?=[,}\]])/g, ':null').replace(/new (?:Map|Set)\(\[\]\)/g, '[]'));
    const modules = [], byId = new Map();
    groups.forEach((g, gi) => (g.contentUnits || []).forEach(cu => {
      const cfg = cu.config || {};
      const layout = ((cfg.displayConfiguration || {}).layout || {}).name || '';
      const stories = (cu.assets || []).filter(a => a && STORY_TYPES.has(a.assetType) && a.id).map(homeStory).filter(x => x.title);
      if (!stories.length || cu.typeName === 'popular-or-trending') return;
      const heading = cfg.heading || '';
      let kind;
      if (/^SHOWCASE/.test(layout)) kind = 'showcase';
      else if (gi === 0 && /highlight/i.test(heading)) kind = 'grid';
      else if (cu.typeName === 'tags-or-categories-with-exclusions') kind = 'column';
      else if (cu.typeName === 'category-and-tag-with-exclusions') kind = 'magazine';
      else if (gi === 0) kind = 'toplist';
      else kind = 'section';
      // The same story can carry a different headline or intro in different blocks.
      const over = {};
      stories.forEach(st => {
        const first = byId.get(st.id);
        if (!first) byId.set(st.id, st);
        else if (first.title !== st.title || first.desc !== st.desc) over[st.id] = [st.title, st.desc];
      });
      const mod = { heading, kind, showHeading: kind !== 'showcase' && kind !== 'toplist' && kind !== 'grid', ids: stories.map(x => x.id) };
      if (Object.keys(over).length) mod.over = over;
      modules.push(mod);
    }));
    if (!modules.length) throw new Error('homepage had no stories');
    return { modules, items: Array.from(byId.values()) };
  }

  async function loadHome(force) {
    const cached = store.get(STORE.feed('home'), null);
    if (cached && cached.items && cached.modules) {
      items = cached.items; homeModules = cached.modules;
      renderList();
      setStatus('Front page · updated ' + timeAgo(cached.at));
    } else {
      items = []; homeModules = [];
      renderSkeleton();
      setStatus('Loading the front page…');
    }
    if (!force && cached && Date.now() - cached.at < 3 * 60 * 1000) { prefetchTop(); return; }
    spin(true);
    try {
      const html = await fetchText('https://www.afr.com/', t => t.indexOf('contentUnitGroups') !== -1);
      const home = parseHome(html);
      if (!store.set(STORE.feed('home'), { at: Date.now(), items: home.items, modules: home.modules })) {
        store.set(STORE.articles, {});
        store.set(STORE.feed('home'), { at: Date.now(), items: home.items, modules: home.modules });
      }
      if (currentTab !== 'home') return;
      items = home.items; homeModules = home.modules;
      renderList();
      setStatus('Front page · updated just now');
      prefetchTop();
    } catch (e) {
      if (currentTab !== 'home') return;
      if (items.length) setStatus('Offline copy — refresh failed (' + e.message + ')', true);
      else { listEl.innerHTML = '<div class="empty">Couldn’t load the front page.<br><small>' + esc(e.message) + '</small></div>'; setStatus('', true); }
    } finally { spin(false); }
  }

  async function loadFeed(force) {
    if (currentTab === 'home') return loadHome(force);
    const feed = FEEDS.find(f => f.id === currentTab);
    const cached = store.get(STORE.feed(feed.id), null);
    if (cached && cached.items && cached.items.length) {
      items = cached.items;
      renderList();
      setStatus(items.length + ' stories · updated ' + timeAgo(cached.at));
    } else {
      items = [];
      renderSkeleton();
      setStatus('Loading ' + feed.name + '…');
    }
    if (!force && cached && Date.now() - cached.at < 3 * 60 * 1000) { prefetchTop(); return; }

    spin(true);
    try {
      // Latest = the front-page feed plus every section feed, which catches far more
      // of the day's stories than the single 20-item feed.
      const sources = feed.id === 'latest' ? FEEDS.filter(f => !f.home && !f.tagPage) : [feed];
      const results = await Promise.allSettled(sources.map(fetchFeedItems));
      const ok = results.filter(r => r.status === 'fulfilled');
      if (!ok.length) throw new Error(results[0].reason.message);
      let fresh = [];
      results.forEach((r, k) => {
        if (r.status !== 'fulfilled') return;
        fresh = fresh.concat(r.value);
        const src = sources[k];
        if (src.id !== feed.id) {
          const prev = store.get(STORE.feed(src.id), null);
          saveArchive(src.id, mergeItems(prev && prev.items, r.value), prev && prev.at ? { at: prev.at } : null);
        }
      });

      const prevItems = (store.get(STORE.feed(feed.id), null) || {}).items || [];
      const known = new Set(prevItems.map(i => i.id));
      const merged = mergeItems(prevItems, fresh);
      const added = prevItems.length ? merged.filter(i => !known.has(i.id)).length : 0;
      saveArchive(feed.id, merged);
      if (feed.id !== currentTab) return; // user switched tabs mid-request
      items = merged;
      renderList();
      const failed = results.length - ok.length;
      setStatus(merged.length + ' stories' + (added ? ' · ' + added + ' new' : '') + ' · updated just now' +
        (failed ? ' · ' + failed + ' section' + (failed > 1 ? 's' : '') + ' unavailable' : ''));
      prefetchTop();
    } catch (e) {
      if (feed.id !== currentTab) return;
      if (items.length) setStatus('Offline copy — refresh failed (' + e.message + ')', true);
      else { listEl.innerHTML = '<div class="empty">Couldn’t load the feed.<br><small>' + esc(e.message) + '</small></div>'; setStatus('', true); }
    } finally { spin(false); }
  }

  // ---------- Article extraction ----------
  // AFR pages embed the full story in window.__staticRouterHydrationData = JSON.parse("…");
  // The argument is a JSON-encoded string, so it decodes with two JSON.parse passes.
  function extractArticle(html) {
    const marker = 'window.__staticRouterHydrationData = JSON.parse(';
    const start = html.indexOf(marker);
    if (start !== -1) {
      const s = start + marker.length;
      const end = html.indexOf(');<\/script>', s);
      const endAlt = end === -1 ? html.indexOf(');\n', s) : end;
      try {
        const data = JSON.parse(JSON.parse(html.slice(s, endAlt)));
        const content = findContent(data);
        if (content) return fromContent(content);
      } catch (e) { /* fall through to JSON-LD */ }
    }
    return extractFromLdJson(html);
  }

  function findContent(o, depth) {
    depth = depth || 0;
    if (!o || typeof o !== 'object' || depth > 8) return null;
    if (o.asset && typeof o.asset.body === 'string') return o;
    for (const k in o) { const r = findContent(o[k], depth + 1); if (r) return r; }
    return null;
  }

  function fromContent(c) {
    const a = c.asset || {};
    const fi = c.featuredImages || {};
    const hero = (fi.landscape3x2 || fi.landscape16x9 || {}).data || null;
    const authors = ((c.participants && c.participants.authors) || []).map(p => ({
      name: p.name,
      avatar: (p.featuredImages && p.featuredImages.woodcut && p.featuredImages.woodcut.data && p.featuredImages.woodcut.data.id) || '',
    }));
    return {
      id: c.id,
      headline: (a.headlines && a.headlines.headline) || '',
      about: a.about || '',
      body: a.body,
      placeholders: a.bodyPlaceholders || {},
      byline: a.byline || authors.map(x => x.name).join(', '),
      authors,
      wordCount: a.wordCount || 0,
      label: c.label || '',
      categories: c.categories || [],
      published: (c.dates && (c.dates.firstPublished || c.dates.published)) || '',
      modified: (c.dates && c.dates.modified) || '',
      hero: hero ? { id: hero.id || hero.fileName, caption: hero.caption || '', credit: hero.credit || '', aspect: hero.aspect || 1.5 } : null,
      url: (c.urls && c.urls.canonical && c.urls.canonical.path) ? 'https://www.afr.com' + c.urls.canonical.path : '',
    };
  }

  function extractFromLdJson(html) {
    const re = /<script[^>]+application\/ld\+json[^>]*>([\s\S]*?)<\/script>/g;
    let m;
    while ((m = re.exec(html))) {
      try {
        const arr = [].concat(JSON.parse(m[1]));
        for (const d of arr) {
          if (d && d.articleBody) {
            return {
              headline: d.headline || '', about: d.description || '',
              body: d.articleBody.split(/\n+/).map(p => '<p>' + esc(p) + '</p>').join(''),
              placeholders: {}, byline: [].concat(d.author || []).map(x => x.name).join(', '),
              authors: [], wordCount: 0, categories: [], label: '',
              published: d.datePublished || '', hero: null, url: '',
            };
          }
        }
      } catch (e) { /* keep looking */ }
    }
    return null;
  }

  function getCachedArticle(id) {
    if (memArticles.has(id)) return memArticles.get(id);
    const all = store.get(STORE.articles, {});
    return all[id] ? all[id].a : null;
  }

  function cacheArticle(id, a) {
    memArticles.set(id, a);
    const all = store.get(STORE.articles, {});
    all[id] = { at: Date.now(), a };
    const keys = Object.keys(all);
    if (keys.length > MAX_CACHED_ARTICLES) {
      keys.sort((x, y) => all[x].at - all[y].at).slice(0, keys.length - MAX_CACHED_ARTICLES).forEach(k => delete all[k]);
    }
    if (!store.set(STORE.articles, all)) {
      // Quota hit: keep only the newest third and try again.
      const keep = Object.keys(all).sort((x, y) => all[y].at - all[x].at).slice(0, Math.floor(MAX_CACHED_ARTICLES / 3));
      const trimmed = {}; keep.forEach(k => trimmed[k] = all[k]);
      store.set(STORE.articles, trimmed);
    }
  }

  function getArticle(id, link) {
    const cached = getCachedArticle(id);
    if (cached) return Promise.resolve(cached);
    if (inflight.has(id)) return inflight.get(id);
    const p = fetchText(link, t => t.length > 2000)
      .then(html => {
        const a = extractArticle(html);
        if (!a || !a.body) throw new Error('no article text found on the page');
        cacheArticle(id, a);
        markReady(id);
        return a;
      })
      .finally(() => inflight.delete(id));
    inflight.set(id, p);
    return p;
  }

  async function prefetchTop() {
    const queue = items.slice(0, PREFETCH_COUNT).filter(i => !getCachedArticle(i.id));
    const worker = async () => {
      while (queue.length) {
        const it = queue.shift();
        try { await getArticle(it.id, it.link); } catch (e) { /* opened on demand later */ }
      }
    };
    await Promise.all(Array.from({ length: PREFETCH_CONCURRENCY }, worker));
  }

  function markReady(id) {
    const el = listEl.querySelector('[data-id="' + cssEsc(id) + '"] .ready-slot');
    if (el && !el.firstChild) el.innerHTML = '<span class="dot-ready" title="Ready to read offline"></span>';
  }

  // ---------- Rendering: feed ----------
  function renderTabs() {
    $('tabs').innerHTML = FEEDS.map(f =>
      '<button class="tab" role="tab" data-tab="' + f.id + '" aria-selected="' + (f.id === currentTab) + '">' + f.name + '</button>'
    ).join('');
  }

  function renderSkeleton() {
    chipsEl.innerHTML = '';
    listEl.innerHTML = Array.from({ length: 6 }, () => '<div class="skel"></div>').join('');
  }

  // One story card. v = [headline size, image placement, show intro, hide kicker]
  function card(i, v, extraClass) {
    const size = v[0], place = v[1], intro = v[2], noKick = v[3];
    const read = readSet.has(i.id) ? ' is-read' : '';
    const tag = i.tag != null ? i.tag : tagFromCategory(i.category);
    const kick = !noKick && (i.label || tag) ? '<div class="kick">' + (i.label ? '<span class="lbl">' + esc(i.label) + '</span>' : '') +
      (tag && tag !== i.label ? '<span class="tag">' + esc(tag) + '</span>' : '') + '</div>' : '';
    const h = '<h3>' + esc(i.title) + '</h3>';
    const p = intro && i.desc ? '<p class="intro">' + esc(i.desc) + '</p>' : '';
    const meta = i.rss ? '<div class="meta"><span class="ready-slot">' + (getCachedArticle(i.id) ? '<span class="dot-ready" title="Ready to read offline"></span>' : '') + '</span>' +
      (i.author ? '<span>' + esc(i.author) + '</span>' : '') + '<span>' + esc(timeAgo(i.date)) + '</span></div>' : '';
    let body;
    if (place === 'side' || place === 'wide') {
      const u = place === 'side' ? (i.sq ? cropUrl(i.sq, 160) : (i.image && smallImage(i.image))) : (i.l32 ? cropUrl(i.l32, 320) : (i.image && smallImage(i.image)));
      body = kick + (u ? '<div class="row"><div>' + h + '</div><img src="' + escAttr(u) + '" alt="" loading="lazy"></div>' : h) + p + meta;
    } else if (place === 'above' || place === 'below') {
      const crop = place === 'above' && !extraClass ? (i.l32 || i.l169) : (i.l169 || i.l32);
      const u = crop ? cropUrl(crop, 720) : i.image;
      const im = u ? '<img class="img-' + place + '" src="' + escAttr(u) + '" alt="" loading="lazy">' : '';
      body = place === 'above' ? im + kick + h + p + meta : kick + h + im + p + meta;
    } else body = kick + h + p + meta;
    const cls = 'c s' + size + (place === 'wide' ? ' wide' : '') + (size === 16 && place === 'none' ? ' compact' : '') + read + (extraClass ? ' ' + extraClass : '');
    return '<a class="' + cls + '" data-id="' + escAttr(i.id) + '" href="#a/' + encodeURIComponent(i.id) + '">' + body + '</a>';
  }

  // Which card each slot gets, matching how afr.com lays its homepage out on a phone.
  function slot(mod, pos, n) {
    switch (mod.kind) {
      case 'showcase': return [[28, 'none', 1], [24, 'none', 1], [24, 'none', 1], [24, 'above', 1], [20, 'wide', 0]][pos] || [20, 'none', 0];
      case 'toplist': return pos < 2 ? [20, 'side', 1] : [20, 'none', 1];
      case 'grid': return [16, 'above', 0];
      case 'column': return [16, 'none', 0, 1];
      case 'magazine': return pos === 0 ? [20, 'side', 0, 1] : [16, 'none', 0, 1];
      default:
        if (/opinion/i.test(mod.heading)) return [pos < 2 ? 24 : 20, pos < 3 ? 'side' : 'none', 1];
        if (/life|luxury|leisure/i.test(mod.heading)) return pos === 0 ? [24, 'none', 1] : [20, 'wide', 1];
        if (pos === 0) return n >= 4 ? [24, 'below', 1] : [20, 'side', 1];
        return pos < 3 ? [20, 'side', 1] : [20, 'none', 1];
    }
  }

  function renderHome() {
    const byId = new Map(items.map(i => [i.id, i]));
    listEl.innerHTML = homeModules.map((mod, mi) => {
      const stories = mod.ids.map(id => {
        const st = byId.get(id), o = mod.over && mod.over[id];
        return st && o ? Object.assign({}, st, { title: o[0], desc: o[1] }) : st;
      }).filter(Boolean);
      if (!stories.length) return '';
      const head = mod.showHeading && mod.heading ? '<div class="mh">' + esc(mod.heading) + '</div>' : (mi > 0 ? '<div class="mod-sep"></div>' : '');
      if (mod.kind === 'grid') return head + '<div class="hgrid">' + stories.map(st => card(st, [16, 'above', 0], 'g')).join('') + '</div>';
      return '<section class="mod">' + head + '<div class="mod-body">' + stories.map((st, pos) => card(st, slot(mod, pos, stories.length))).join('') + '</div></section>';
    }).join('');
  }

  function renderList() {
    const q = $('search').value.trim().toLowerCase();
    const isHome = currentTab === 'home';
    document.body.classList.toggle('on-home', isHome);
    renderBrief('auto');
    if (isHome && !q) { chipsEl.innerHTML = ''; renderHome(); return; }

    const cats = {};
    if (!isHome) items.forEach(i => { const c = topCategory(i.category); if (c) cats[c] = (cats[c] || 0) + 1; });
    const catNames = Object.keys(cats).sort((a, b) => cats[b] - cats[a]);
    if (categoryFilter && !cats[categoryFilter]) categoryFilter = null;
    chipsEl.innerHTML = catNames.length > 1 ? catNames.map(c =>
      '<button class="chip" data-cat="' + escAttr(c) + '" aria-pressed="' + (c === categoryFilter) + '">' + esc(c) + ' <span style="opacity:.6">' + cats[c] + '</span></button>'
    ).join('') : '';

    const shown = items.filter(i =>
      (!categoryFilter || topCategory(i.category) === categoryFilter) &&
      (!q || (i.title + ' ' + i.desc + ' ' + i.author + ' ' + i.category + ' ' + (i.tag || '')).toLowerCase().includes(q))
    );
    if (!shown.length) { listEl.innerHTML = '<div class="empty">No stories match.</div>'; return; }

    let lastDay = null;
    listEl.innerHTML = shown.map((i, idx) => {
      const it = isHome ? i : Object.assign({ rss: true }, i);
      if (isHome) return card(it, [20, 'side', 1]);
      const day = dayLabel(i.date);
      const header = day !== lastDay ? '<div class="day">' + esc(day) + '</div>' : '';
      lastDay = day;
      const lead = idx === 0 && !q && !categoryFilter;
      return header + card(it, lead ? [24, 'below', 1] : [20, 'side', 1]);
    }).join('');
  }

  function tagFromCategory(c) { const parts = (c || '').split('/'); return parts[parts.length - 1].trim(); }
  function topCategory(c) { return (c || '').split('/')[0].trim(); }
  function smallImage(u) { return u.replace(/\$width_\d+/, '$width_320'); }

  // ---------- Rendering: article ----------
  function findItem(id) {
    for (const f of FEEDS) {
      const c = f.id === currentTab ? { items } : store.get(STORE.feed(f.id), null);
      const hit = c && c.items && c.items.find(i => i.id === id);
      if (hit) return hit;
    }
    return null;
  }

  // Neighbours in the tab you came from, as in the AFR app: swipe left = next, right = previous.
  function neighbour(id, step) {
    const i = items.findIndex(x => x.id === id);
    return i === -1 ? null : items[i + step] || null;
  }
  function goArticle(id, dir) {
    // Replace rather than push, so Back still returns to the list rather than walking every story.
    history.replaceState(null, '', '#a/' + encodeURIComponent(id));
    readerEl.classList.remove('slide-l', 'slide-r'); void readerEl.offsetWidth;
    readerEl.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
    route();
  }
  (function swipe() {
    let x0 = 0, y0 = 0, t0 = 0, tracking = false;
    readerEl.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { tracking = false; return; }
      const t = e.touches[0];
      // Leave the screen edges to iOS's own back/forward gesture, and let wide tables/embeds scroll.
      tracking = t.clientX > 24 && t.clientX < window.innerWidth - 24 && !e.target.closest('iframe, table, .embed');
      x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    }, { passive: true });
    readerEl.addEventListener('touchend', e => {
      if (!tracking) return; tracking = false;
      const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
      if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8 || Date.now() - t0 > 700) return;
      if (window.getSelection && String(window.getSelection())) return;
      const id = currentRoute(); if (!id) return;
      const n = neighbour(id, dx < 0 ? 1 : -1);
      if (n) goArticle(n.id, dx < 0 ? 1 : -1);
      else toast(dx < 0 ? 'Last story in this tab' : 'First story in this tab');
    }, { passive: true });
  })();

  async function openArticle(id) {
    sumOpen = false;
    // Warm the neighbours so a swipe opens instantly.
    [1, -1].forEach(step => { const n = neighbour(id, step); if (n) getArticle(n.id, n.link).catch(() => {}); });
    document.body.classList.add('reading');
    $('backBtn').hidden = false; $('sizeUp').hidden = false; $('sizeDown').hidden = false; $('settingsBtn').hidden = true;
    window.scrollTo(0, 0);

    const item = findItem(id) || { id, link: 'https://www.afr.com/link/follow-20180101-' + id, title: '', desc: '' };
    const cached = getCachedArticle(id);
    if (cached) renderArticle(item, cached);
    else {
      readerEl.innerHTML = '<article class="story">' +
        ((item.tag || item.category) ? '<div class="kicker">' + esc(item.tag || tagFromCategory(item.category)) + '</div>' : '') +
        '<h1>' + esc(item.title || 'Loading…') + '</h1>' +
        (item.desc ? '<p class="standfirst">' + esc(item.desc) + '</p>' : '') +
        '<div class="status" style="margin-top:24px">Extracting full text…</div>' +
        '<div class="skel"></div><div class="skel"></div><div class="skel"></div></article>';
      try {
        const a = await getArticle(id, item.link);
        if (currentRoute() !== id) return;
        renderArticle(item, a);
      } catch (e) {
        if (currentRoute() !== id) return;
        renderFailure(item, e);
      }
    }
    readSet.add(id);
    store.set(STORE.read, Array.from(readSet).slice(-500));
  }

  function renderArticle(item, a) {
    const url = a.url || item.link;
    const kicker = [a.label || item.label, item.tag || (a.categories.length ? a.categories[a.categories.length - 1] : tagFromCategory(item.category))].filter(Boolean).join(' · ');
    const mins = a.wordCount ? Math.max(1, Math.round(a.wordCount / 230)) + ' min read' : '';
    const author = a.authors[0];
    const when = a.published ? fmtDate(a.published) : (item.date ? fmtDate(item.date) : '');

    let html = '<article class="story">';
    if (kicker) html += '<div class="kicker">' + esc(kicker) + '</div>';
    html += '<h1>' + esc(a.headline || item.title) + '</h1>';
    if (a.about || item.desc) html += '<p class="standfirst">' + esc(a.about || item.desc) + '</p>';
    html += '<div class="byline">' +
      (author && author.avatar ? '<img src="' + escAttr(img(author.avatar, 120)) + '" alt="">' : '') +
      '<div><div class="who">' + esc(a.byline || item.author || 'Financial Review') + '</div>' +
      '<div class="when">' + esc([when, mins].filter(Boolean).join(' · ')) + '</div></div></div>';
    html += '<section class="ai" id="aiSum"></section>';
    if (a.hero) html += figure(a.hero.id, a.hero.caption, a.hero.credit, 'hero', a.hero.aspect);
    html += '<div class="body" id="storyBody"></div>';
    html += '<div class="story-foot">' +
      '<a class="pill" href="' + escAttr(url) + '" target="_blank" rel="noopener">Open on afr.com ↗</a>' +
      '<button class="pill" id="shareBtn">Share</button>' +
      '<a class="pill" href="' + escAttr(removePaywallUrl(url)) + '" target="_blank" rel="noopener">removepaywall ↗</a>' +
      '</div>';
    html += nextUpHtml(item.id);
    if (neighbour(item.id, 1) || neighbour(item.id, -1)) html += '<p class="swipe-hint">Swipe left or right for the next or previous story</p>';
    html += '</article>';
    readerEl.innerHTML = html;
    $('storyBody').appendChild(buildBody(a.body, a.placeholders));
    renderSummary(item, a, false);
    $('shareBtn').onclick = () => share(a.headline || item.title, url);
    updateProgress();
  }

  function renderFailure(item, e) {
    const url = item.link;
    readerEl.innerHTML = '<article class="story fail">' +
      '<h2>' + esc(item.title || 'Couldn’t extract this story') + '</h2>' +
      '<p>The full text couldn’t be pulled from AFR (' + esc(e.message) + '). Try again, or use one of the fallbacks.</p>' +
      '<div class="story-foot" style="border:0;margin:0;padding:0">' +
      '<button class="pill primary" id="retryBtn">Try again</button>' +
      '<a class="pill" href="' + escAttr(removePaywallUrl(url)) + '" target="_blank" rel="noopener">removepaywall ↗</a>' +
      '<a class="pill" href="https://archive.ph/newest/' + escAttr(url) + '" target="_blank" rel="noopener">archive.ph ↗</a>' +
      '<a class="pill" href="' + escAttr(url) + '" target="_blank" rel="noopener">afr.com ↗</a>' +
      '</div></article>';
    $('retryBtn').onclick = () => openArticle(item.id);
  }

  function nextUpHtml(id) {
    const idx = items.findIndex(i => i.id === id);
    const next = items.slice(idx + 1).find(i => !readSet.has(i.id)) || items[idx + 1];
    if (!next || idx === -1) return '';
    return '<div class="nextup"><div class="label">Next up</div>' + card(next, [20, 'side', 1]) + '</div>';
  }

  function figure(id, caption, credit, cls, aspect) {
    const ar = aspect > 0.2 && aspect < 5 ? ' style="--ar:' + (+aspect).toFixed(4) + '"' : '';
    return '<figure' + (cls ? ' class="' + cls + '"' : '') + ar + '>' +
      '<img src="' + escAttr(img(id, 1200)) + '" srcset="' + escAttr(img(id, 640)) + ' 640w, ' + escAttr(img(id, 1200)) + ' 1200w" sizes="(max-width: 760px) 100vw, 728px" alt="' + escAttr(caption || '') + '" loading="' + (cls === 'hero' ? 'eager' : 'lazy') + '">' +
      ((caption || credit) ? '<figcaption>' + esc(caption || '') + (credit ? ' <span class="credit">' + esc(credit) + '</span>' : '') + '</figcaption>' : '') +
      '</figure>';
  }

  // Parse the story HTML inertly, swap AFR's <x-placeholder> tokens for real elements,
  // and keep only a small allowlist of tags/attributes.
  const ALLOWED = new Set(['P', 'H2', 'H3', 'H4', 'EM', 'I', 'STRONG', 'B', 'BR', 'UL', 'OL', 'LI', 'A', 'BLOCKQUOTE', 'SUP', 'SUB', 'FIGURE', 'FIGCAPTION', 'IMG', 'DIV', 'SPAN', 'IFRAME', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH']);
  function buildBody(bodyHtml, placeholders) {
    const doc = new DOMParser().parseFromString('<div id="r">' + bodyHtml + '</div>', 'text/html');
    const root = doc.getElementById('r');

    root.querySelectorAll('x-placeholder').forEach(ph => {
      const p = placeholders[ph.getAttribute('id')];
      const replacement = p ? placeholderNode(doc, p) : null;
      if (replacement) ph.replaceWith(replacement); else ph.remove();
    });
    // Figures/embeds can't live inside <p>; lift them out.
    root.querySelectorAll('p > figure, p > .embed, p > blockquote').forEach(n => n.parentNode.after(n));
    root.querySelectorAll('p').forEach(p => { if (!p.textContent.trim() && !p.querySelector('img,iframe')) p.remove(); });

    sanitize(root);
    const frag = document.createDocumentFragment();
    Array.from(root.childNodes).forEach(n => frag.appendChild(document.importNode(n, true)));
    return frag;
  }

  function placeholderNode(doc, p) {
    const d = p.data || {};
    const tpl = doc.createElement('template');
    switch (p.type) {
      case 'image':
        tpl.innerHTML = figure(d.id || d.fileName, d.caption, d.credit, '', d.aspect);
        return tpl.content.firstChild;
      case 'linkExternal': {
        const a = doc.createElement('a');
        a.href = d.url; a.textContent = d.text || d.url;
        return a;
      }
      case 'linkArticle': {
        const a = doc.createElement('a');
        a.href = '#a/' + encodeURIComponent(d.id);
        a.textContent = d.text || '';
        return a;
      }
      case 'quote': {
        const q = doc.createElement('blockquote');
        if (d.markup) q.innerHTML = d.markup; else q.textContent = d.quote || '';
        return q;
      }
      case 'iframe': {
        if (!/^https:\/\//.test(d.url || '')) return null;
        const w = doc.createElement('div'); w.className = 'embed';
        const f = doc.createElement('iframe');
        f.src = d.url; f.loading = 'lazy'; f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups');
        w.appendChild(f);
        return w;
      }
      default:
        return null; // relatedStory, ads, etc.
    }
  }

  function sanitize(node) {
    Array.from(node.children).forEach(el => {
      if (!ALLOWED.has(el.tagName)) {
        if (/^(SCRIPT|STYLE|NOSCRIPT|OBJECT|EMBED|FORM|INPUT|BUTTON|LINK|META)$/.test(el.tagName)) { el.remove(); return; }
        const span = el.ownerDocument.createElement('span');
        while (el.firstChild) span.appendChild(el.firstChild);
        el.replaceWith(span); sanitize(span); return;
      }
      Array.from(el.attributes).forEach(at => {
        const n = at.name.toLowerCase();
        const keep = ['href', 'src', 'srcset', 'sizes', 'alt', 'loading', 'class', 'sandbox'].includes(n) ||
          (n === 'style' && el.tagName === 'FIGURE' && /^--ar:[\d.]+$/.test(at.value));
        if (!keep || /^\s*javascript:/i.test(at.value)) el.removeAttribute(at.name);
      });
      if (el.tagName === 'A' && !/^#a\//.test(el.getAttribute('href') || '')) {
        el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener');
      }
      sanitize(el);
    });
  }

  function removePaywallUrl(u) { return 'https://www.removepaywall.com/search?url=' + encodeURIComponent(u); }

  // ---------- Routing ----------
  function currentRoute() {
    const m = /^#a\/(.+)$/.exec(location.hash);
    return m ? decodeURIComponent(m[1]) : null;
  }
  // Tabs live in the URL (#t/latest) so the back button and swipe-back move between them.
  function tabFromHash() {
    const m = /^#t\/([\w-]+)$/.exec(location.hash);
    return m && FEEDS.some(f => f.id === m[1]) ? m[1] : null;
  }
  function switchTab(id) {
    if (id === currentTab) return false;
    feedScrolls[currentTab] = window.scrollY;
    currentTab = id; store.set(STORE.tab, id);
    categoryFilter = null; $('search').value = '';
    renderTabs();
    const sel = $('tabs').querySelector('[aria-selected="true"]');
    if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'center' });
    loadFeed(false);
    return true;
  }
  const feedScrolls = {};
  let feedScroll = 0;
  let cameFromFeed = false;
  function route() {
    const id = currentRoute();
    if (id) {
      if (!document.body.classList.contains('reading')) { feedScroll = window.scrollY; cameFromFeed = booted; }
      openArticle(id);
    } else {
      const wasReading = document.body.classList.contains('reading');
      cameFromFeed = false;
      document.body.classList.remove('reading');
      $('backBtn').hidden = true; $('sizeUp').hidden = true; $('sizeDown').hidden = true; $('settingsBtn').hidden = false;
      readerEl.innerHTML = '';
      $('progress').style.width = '0';
      const changed = switchTab(tabFromHash() || 'home');
      if (!changed) renderList();
      const y = wasReading ? feedScroll : (changed ? (feedScrolls[currentTab] || 0) : window.scrollY);
      requestAnimationFrame(() => window.scrollTo(0, y));
    }
  }

  // ---------- UI helpers ----------
  function setStatus(msg, isErr) { statusEl.textContent = msg; statusEl.classList.toggle('err', !!isErr); }
  function spin(on) { $('refreshBtn').classList.toggle('spin', on); }
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  async function share(title, url) {
    try {
      if (navigator.share) { await navigator.share({ title, url }); return; }
      await navigator.clipboard.writeText(url); toast('Link copied');
    } catch (e) { /* cancelled */ }
  }
  function updateProgress() {
    if (!document.body.classList.contains('reading')) return;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    $('progress').style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0) + '%';
  }
  function applySize(px) {
    px = Math.max(15, Math.min(28, px));
    document.documentElement.style.setProperty('--reader-size', px + 'px');
    store.set(STORE.size, px);
    return px;
  }
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  }

  function parseDate(s) {
    if (!s) return null;
    let d = new Date(s);
    if (isNaN(d)) d = new Date(String(s).replace(/ ([+-]\d{2})(\d{2})$/, ' GMT$1$2'));
    return isNaN(d) ? null : d;
  }
  function timeAgo(s) {
    const d = typeof s === 'number' ? new Date(s) : parseDate(s);
    if (!d) return '';
    const mins = Math.round((Date.now() - d) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
  }
  function dayLabel(s) {
    const d = parseDate(s);
    if (!d) return '';
    const key = x => x.toLocaleDateString('en-AU', { timeZone: 'Australia/Sydney' });
    if (key(d) === key(new Date())) return 'Today';
    if (key(d) === key(new Date(Date.now() - 864e5))) return 'Yesterday';
    return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Australia/Sydney' });
  }
  function fmtDate(s) {
    const d = parseDate(s);
    return d ? d.toLocaleString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Australia/Sydney' }) : '';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function escAttr(s) { return esc(s); }
  function cssEsc(s) { return window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/"/g, '\\"'); }

  // ---------- AI (OpenAI, key kept on this device only) ----------
  const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>';
  function aiKey() {
    // Fall back to the key already saved for Ask Ben on this device, if there is one.
    let k = store.get(STORE.key, null);
    if (!k) { try { k = localStorage.getItem('ben-chat-openai-key'); } catch (e) { k = null; } }
    return k || '';
  }
  function aiModel() { const m = store.get(STORE.model, ''); return m && m !== 'gpt-5.2' ? m : DEFAULT_MODEL; }
  function aiPrefs() { return Object.assign({ autoBrief: true, autoSum: true }, store.get(STORE.aiPrefs, {})); }

  async function openaiJSON(system, user, maxTokens, effort) {
    const key = aiKey();
    if (!key) throw Object.assign(new Error('No OpenAI key'), { code: 'nokey' });
    const body = {
      model: aiModel(),
      messages: [{ role: 'system', content: system }, { role: 'user', content: user }],
      response_format: { type: 'json_object' },
      max_completion_tokens: maxTokens || 3000,
      reasoning_effort: effort || 'low',
    };
    const call = b => fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(b),
    });
    let r = await call(body);
    if (r.status === 400) {
      const t = await r.clone().text();
      if (/reasoning_effort/.test(t)) { delete body.reasoning_effort; r = await call(body); }
    }
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
      if (r.status === 401) msg = 'OpenAI rejected the key — check it in Settings.';
      if (r.status === 429) msg = 'OpenAI rate limit or quota reached — try again shortly. (' + msg + ')';
      throw new Error(msg);
    }
    const j = await r.json();
    const text = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if (!text) throw new Error('Empty response from OpenAI');
    return JSON.parse(text);
  }

  function bulletsHtml(bullets, withRefs) {
    return '<ul>' + (bullets || []).slice(0, 8).map(b => {
      let refs = '';
      if (withRefs && Array.isArray(b.ids)) {
        const links = b.ids.map(id => findItem(String(id))).filter(Boolean).slice(0, 3)
          .map(it => '<a href="#a/' + encodeURIComponent(it.id) + '">' + esc(shorten(it.title, 58)) + '</a>');
        if (links.length) refs = '<span class="refs">' + links.join('') + '</span>';
      }
      return '<li><b>' + esc(String(b.lead || '').replace(/[:.\s]+$/, '')) + '.</b> ' + esc(b.text || '') + refs + '</li>';
    }).join('') + '</ul>';
  }
  function shorten(t, n) { t = String(t || ''); return t.length > n ? t.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : t; }
  function aiNoKey(label) {
    return '<p class="ai-msg">Add your OpenAI key in <button type="button" data-open-settings>Settings</button> to get ' + label + '.</p>';
  }
  function skeleton(n) { let h = ''; for (let i = 0; i < n; i++) h += '<div class="skl"></div>'; return h; }
  function articleText(a) {
    const doc = new DOMParser().parseFromString('<div>' + (a.body || '') + '</div>', 'text/html');
    doc.querySelectorAll('x-placeholder, script, style').forEach(n => n.remove());
    return Array.from(doc.querySelectorAll('p, h2, h3, li')).map(n => n.textContent.trim()).filter(Boolean).join('\n\n');
  }

  // --- Article summary: five bullets, bold lead-ins, analysis not just recap ---
  const SUM_SYSTEM = [
    'You are a senior financial journalist and markets analyst briefing a time-poor Australian executive and investor on an Australian Financial Review article.',
    'Write exactly 5 bullets. Each has a bold lead-in ("lead": 2–5 words that make the point itself, never a label like "Key point") and "text": ONE sentence of at most 22 words. Be terse and specific: numbers and names over adjectives.',
    'Go well beyond a recap. Across the five bullets cover: (1) the core news with the specifics that matter — figures, names, dates, deal terms; (2) what is really driving it and why it matters now; (3) the implications for investors, markets, the sector, competitors or policy — who wins and who loses; (4) a genuine counterpoint, risk, tension or open question — what critics or the other side would say, or what the story leaves unsaid; (5) what to watch next and when.',
    'Signal your own inference in a word or two ("likely", "the risk:") — never long disclaimers. Never invent facts, numbers or quotes. Do not repeat the headline. Australian English. No filler.',
    'Return JSON only: {"bullets":[{"lead":"…","text":"…"}]}',
  ].join('\n');

  const sumInflight = new Map();
  // The summary starts folded so you can read the story first; it keeps generating in the
  // background and the header says when it's ready. Tap the header to open it.
  let sumOpen = false;
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  function paintSummary(state, stateHtml, bodyHtml) {
    const el = $('aiSum'); if (!el) return;
    el.className = 'ai sum' + (sumOpen ? ' open' : '');
    el.innerHTML = '<button type="button" class="sum-toggle ai-head" data-sumtoggle aria-expanded="' + sumOpen + '">' + SPARK +
      '<span>AI summary</span><span class="spacer"></span><span class="state' + (state === 'ready' ? ' ready' : '') + '">' + stateHtml + '</span>' + CHEV + '</button>' +
      '<div class="sum-body">' + bodyHtml + '</div>';
  }

  async function renderSummary(item, a, force) {
    if (!$('aiSum')) return;
    const id = item.id;
    const cache = store.get(STORE.sums, {});
    const hit = !force && cache[id];
    if (hit) {
      paintSummary('ready', 'Ready', bulletsHtml(hit.bullets) +
        '<div class="ai-foot">' + esc(hit.model || '') + ' · ' + esc(timeAgo(hit.at)) + ' · <button type="button" data-resum style="color:var(--accent);font-weight:600">Regenerate</button></div>');
      return;
    }
    if (!aiKey()) { paintSummary('', 'Add key', aiNoKey('a five-point summary of every article')); return; }
    if (!force && !aiPrefs().autoSum) { paintSummary('', 'Off', '<p class="ai-msg"><button type="button" data-resum>Summarise this article</button></p>'); return; }
    paintSummary('', '<span class="spin-dot"></span>Writing…', '<p class="ai-msg">Reading the article…</p>' + skeleton(5));
    try {
      let p = sumInflight.get(id);
      if (!p) {
        const user = 'Headline: ' + (a.headline || item.title) + '\nStandfirst: ' + (a.about || item.desc || '') +
          '\nBy: ' + (a.byline || item.author || '') + '\nPublished: ' + (a.published || item.date || '') +
          '\nSection: ' + [a.label, (a.categories || []).join(' / ')].filter(Boolean).join(' · ') +
          '\n\nARTICLE:\n' + articleText(a).slice(0, 24000);
        // No extended reasoning for single-article summaries: much faster, and the prompt carries the structure.
        p = openaiJSON(SUM_SYSTEM, user, 1500, 'none').finally(() => sumInflight.delete(id));
        sumInflight.set(id, p);
      }
      const out = await p;
      if (!Array.isArray(out.bullets) || !out.bullets.length) throw new Error('Unexpected response shape');
      const all = store.get(STORE.sums, {});
      all[id] = { at: Date.now(), model: aiModel(), bullets: out.bullets.slice(0, 5) };
      const keys = Object.keys(all);
      if (keys.length > 200) keys.sort((x, y) => all[x].at - all[y].at).slice(0, keys.length - 200).forEach(k => delete all[k]);
      store.set(STORE.sums, all);
      if (currentRoute() === id) renderSummary(item, a, false);
    } catch (e) {
      if (currentRoute() !== id) return;
      paintSummary('', 'Failed', '<p class="ai-msg">Couldn’t summarise: ' + esc(e.message) + ' <button type="button" data-resum>Try again</button></p>');
    }
  }

  // --- Tab briefing: a coffee-length read on everything in the tab ---
  function briefSystem(tabName) {
    return [
      'You are the editor of a premium morning briefing read over coffee by a senior Australian executive and investor before their day starts.',
      'You are given the current stories from the Australian Financial Review' + (tabName === 'Home' ? ' front page (in the editors’ running order)' : ' "' + tabName + '" section') + ', some with article excerpts.',
      'It must be skimmable in under a minute. Write: "take" — ONE sentence (max 25 words) on the day’s dominant theme; then "bullets" — exactly 5 items ordered by importance to a business reader (not list order).',
      'Each bullet has a bold lead-in ("lead": 2–5 words that state the point) and "text": ONE sentence, max 28 words, that synthesises rather than lists — the key specific (a figure or name) plus why it matters or the angle others miss (who wins/loses, the tension, the risk). Signal your own inference in a word ("likely", "risk:"), never with long disclaimers. Never invent facts.',
      'Each bullet also has "ids": the 1–3 story ids it draws on, copied exactly from the list.',
      'Finish with "watch": what to watch today or this week, max 15 words.',
      'Australian English. No filler, no "In today’s news". Return JSON only: {"take":"…","bullets":[{"lead":"…","text":"…","ids":["…"]}],"watch":"…"}',
    ].join('\n');
  }
  function briefSignature(list) { return list.slice(0, 20).map(i => i.id).join(','); }
  const briefInflight = new Map();

  // mode: 'auto' when the list is drawn, 'force' from the Refresh button, 'show' after a new one lands.
  function renderBrief(mode) {
    mode = mode || 'auto';
    const el = $('brief');
    const tab = currentTab, feed = FEEDS.find(f => f.id === tab);
    if (!items.length || $('search').value.trim()) { el.innerHTML = ''; return; }
    const title = tab === 'home' ? 'Morning briefing' : feed.name + ' briefing';
    const collapsed = store.get('afr-brief-collapsed', false);
    const head = '<div class="ai-head">' + SPARK + '<span>' + esc(title) + '</span><span class="spacer"></span>';
    const cached = mode === 'force' ? null : store.get(STORE.brief(tab), null);
    const sig = briefSignature(items);
    const fresh = cached && (Date.now() - cached.at < 6 * 3600e3) && (cached.sig === sig || Date.now() - cached.at < 90 * 60e3);
    const canAuto = aiKey() && aiPrefs().autoBrief;
    if (cached) {
      const busy = briefInflight.has(tab);
      el.innerHTML = '<section class="ai' + (collapsed ? ' collapsed' : '') + '">' + head +
        '<button type="button" data-rebrief>' + (busy ? 'Updating…' : 'Refresh') + '</button><button type="button" data-collapse>' + (collapsed ? 'Show' : 'Hide') + '</button></div>' +
        (cached.data.take ? '<p class="ai-take">' + esc(cached.data.take) + '</p>' : '') +
        bulletsHtml(cached.data.bullets, true) +
        (cached.data.watch ? '<p class="ai-watch"><b>Watch:</b> ' + esc(cached.data.watch) + '</p>' : '') +
        '<div class="ai-foot">' + esc(cached.model || '') + ' · written ' + esc(timeAgo(cached.at)) + (cached.sig !== sig && !busy ? ' · new stories since' : '') + '</div></section>';
      if (mode === 'auto' && !fresh && canAuto) generateBrief(tab, feed);
      return;
    }
    if (!aiKey()) { el.innerHTML = '<section class="ai">' + head + '</div>' + aiNoKey('a morning briefing across these stories') + '</section>'; return; }
    if (mode === 'auto' && !canAuto) {
      el.innerHTML = '<section class="ai">' + head + '</div><p class="ai-msg"><button type="button" data-rebrief>Write the briefing</button></p></section>';
      return;
    }
    el.innerHTML = '<section class="ai">' + head + '</div><p class="ai-msg">Reading today’s stories…</p>' + skeleton(6) + '</section>';
    generateBrief(tab, feed);
  }

  async function generateBrief(tab, feed) {
    if (briefInflight.has(tab)) return;
    briefInflight.set(tab, true);
    // Give the top stories a moment to download so the briefing can use their full text.
    await Promise.race([prefetchTop(), new Promise(r => setTimeout(r, 20000))]);
    if (currentTab !== tab) { briefInflight.delete(tab); return; }
    const list = items.slice(0, 40), sig = briefSignature(items);
    const lines = list.map((i, n) => {
      const a = getCachedArticle(i.id);
      let line = '[' + i.id + '] ' + (i.label ? i.label + ' · ' : '') + (i.tag || tagFromCategory(i.category) || '') + ' — ' + i.title + (i.desc ? ' — ' + i.desc : '');
      if (a && n < 14) line += '\n   Excerpt: ' + articleText(a).slice(0, 1400).replace(/\s+/g, ' ');
      return line;
    }).join('\n');
    const today = new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Australia/Sydney' });
    try {
      const out = await openaiJSON(briefSystem(feed.name), 'Today is ' + today + '.\n\nSTORIES:\n' + lines, 4000);
      if (!Array.isArray(out.bullets) || !out.bullets.length) throw new Error('Unexpected response shape');
      store.set(STORE.brief(tab), { at: Date.now(), sig, model: aiModel(), data: out });
      briefInflight.delete(tab);
      if (currentTab === tab && !currentRoute()) renderBrief('show');
    } catch (e) {
      if (currentTab === tab && !currentRoute()) {
        const el = $('brief');
        const box = el.querySelector('.ai') || el;
        const msg = document.createElement('p'); msg.className = 'ai-msg';
        msg.innerHTML = 'Couldn’t write the briefing: ' + esc(e.message) + ' <button type="button" data-rebrief>Try again</button>';
        box.querySelectorAll('.skl').forEach(n => n.remove());
        const old = box.querySelector('.ai-msg'); if (old && !box.querySelector('ul')) old.remove();
        box.appendChild(msg);
      }
    } finally { briefInflight.delete(tab); }
  }

  // --- Settings ---
  function openSettings() {
    const k = store.get(STORE.key, '');
    $('keyInput').value = k || '';
    let benKey = ''; try { benKey = localStorage.getItem('ben-chat-openai-key') || ''; } catch (e) {}
    $('keyInput').placeholder = !k && benKey ? 'Using the key saved for Ask Ben' : 'sk-…';
    $('modelInput').value = store.get(STORE.model, '') || '';
    $('modelInput').placeholder = DEFAULT_MODEL;
    const pr = aiPrefs();
    $('autoBrief').checked = pr.autoBrief; $('autoSum').checked = pr.autoSum;
    $('darkMode').checked = isDark();
    try { $('settings').showModal(); } catch (e) { $('settings').setAttribute('open', ''); }
  }
  $('settingsBtn').addEventListener('click', openSettings);
  document.addEventListener('click', e => {
    if (e.target.closest('[data-open-settings]')) { e.preventDefault(); openSettings(); }
    else if (e.target.closest('[data-rebrief]')) { e.preventDefault(); if (!briefInflight.has(currentTab)) { store.set(STORE.brief(currentTab), null); renderBrief('force'); } }
    else if (e.target.closest('[data-collapse]')) { e.preventDefault(); store.set('afr-brief-collapsed', !store.get('afr-brief-collapsed', false)); renderBrief('show'); }
    else if (e.target.closest('[data-sumtoggle]')) {
      e.preventDefault();
      sumOpen = !sumOpen;
      const el = $('aiSum'); el.classList.toggle('open', sumOpen);
      el.querySelector('[data-sumtoggle]').setAttribute('aria-expanded', sumOpen);
    }
    else if (e.target.closest('[data-resum]')) {
      e.preventDefault();
      const id = currentRoute(), a = id && getCachedArticle(id);
      if (a) { sumOpen = true; renderSummary(findItem(id) || { id, title: a.headline, desc: a.about }, a, true); }
    }
  });
  $('settingsForm').addEventListener('submit', () => {
    const k = $('keyInput').value.trim();
    if (k) store.set(STORE.key, k);
    const m = $('modelInput').value.trim();
    store.set(STORE.model, m || '');
    store.set(STORE.aiPrefs, { autoBrief: $('autoBrief').checked, autoSum: $('autoSum').checked });
    const dark = $('darkMode').checked;
    if (dark !== isDark()) { applyTheme(dark ? 'dark' : 'light'); store.set(STORE.theme, dark ? 'dark' : 'light'); }
    toast(k ? 'Saved — key stored on this device' : 'Saved');
    if (currentRoute()) { const id = currentRoute(), a = getCachedArticle(id); if (a) renderSummary(findItem(id) || { id }, a, false); }
    else renderBrief('auto');
  });
  $('forgetKey').addEventListener('click', () => {
    try { localStorage.removeItem(STORE.key); } catch (e) {}
    $('keyInput').value = ''; toast('Key removed from this device');
  });
  $('clearAi').addEventListener('click', () => {
    try { Object.keys(localStorage).filter(k => k.indexOf('afr-ai-summaries') === 0 || k.indexOf('afr-ai-brief') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    toast('Saved summaries cleared');
  });

  // ---------- Events ----------
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    if (b.dataset.tab === currentTab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    feedScrolls[b.dataset.tab] = 0;
    location.hash = 't/' + b.dataset.tab;
  });
  chipsEl.addEventListener('click', e => {
    const c = e.target.closest('[data-cat]'); if (!c) return;
    categoryFilter = categoryFilter === c.dataset.cat ? null : c.dataset.cat;
    renderList();
  });
  $('search').addEventListener('input', renderList);
  $('refreshBtn').addEventListener('click', () => {
    const id = currentRoute();
    if (id) {
      memArticles.delete(id);
      const all = store.get(STORE.articles, {}); delete all[id]; store.set(STORE.articles, all);
      openArticle(id);
    } else loadFeed(true);
  });
  // Go back through history when we arrived from the feed, so its scroll position survives.
  $('backBtn').addEventListener('click', () => { if (cameFromFeed) history.back(); else location.hash = 't/' + currentTab; });
  // The masthead always takes you to the front page, like afr.com.
  $('brand').addEventListener('click', e => {
    e.preventDefault();
    if (currentTab === 'home' && !currentRoute()) window.scrollTo({ top: 0, behavior: 'smooth' });
    else { feedScrolls.home = 0; location.hash = 't/home'; }
  });
  let size = store.get(STORE.size, 20);
  applySize(size);
  $('sizeUp').addEventListener('click', () => { size = applySize(size + 1); });
  $('sizeDown').addEventListener('click', () => { size = applySize(size - 1); });
  applyTheme(store.get(STORE.theme, null));
  function isDark() { return getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#121417'; }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && currentRoute() && !$('settings').open) $('backBtn').click();
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && currentRoute() && !$('settings').open) {
      const n = neighbour(currentRoute(), e.key === 'ArrowRight' ? 1 : -1);
      if (n) goArticle(n.id, e.key === 'ArrowRight' ? 1 : -1);
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !currentRoute()) loadFeed(false);
  });

  // ---------- Boot ----------
  let booted = false;
  renderTabs();
  if (!currentRoute() && !tabFromHash()) history.replaceState(null, '', '#t/home');
  loadFeed(false);
  route();
  booted = true;
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
